# cargo-generate manifest for the RustStream device starter on the embassy runtime.
#
# Render it with:
#   cargo generate --git https://github.com/powersemmi/ruststream templates/embassy-memory --name my-device
#
# `{{project-name}}` (the --name value) is a cargo-generate built-in; no placeholders need declaring.
#
# The manifest is `Cargo.toml.liquid`: cargo-generate drops the suffix after rendering, and cargo
# never parses a placeholder package name when it walks this repository as a git source.
[template]
description = "A RustStream firmware for a Cortex-M on the embassy runtime, over the in-process bus, with no heap"

[package]
name = "ruststream-testing"
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The TestApp harness of the RustStream messaging framework; services use it through `ruststream`."
keywords = ["messaging", "testing", "broker", "pubsub", "ruststream"]
categories = ["asynchronous", "development-tools::testing"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
# The framework's heap variant, which the harness follows: it never turns `alloc` on by itself
# (its own bookkeeping may allocate, being `std` code), so the embedded `TestApp` drives the
# no-alloc surface unless the build asks for this variant.
alloc = ["ruststream-core/alloc", "ruststream-runtime/alloc"]
# The runtimes whose apps the harness drives; they add up. Each also enables its facade feature,
# which the tests and doc examples build against, as a service of that runtime depends on it.
# `TestApp` over the tokio runner's app.
tokio = [
    "dep:ruststream-runtime-tokio",
    "dep:inventory",
    "dep:tokio",
    "dep:tokio-util",
    "tokio/test-util",
    "ruststream/tokio",
]
# `TestApp` over the embedded runner's app, on the host: the harness is the test build's time
# driver, over the generic timer queue that serves any waker, since the harness polls the app
# inside its own future.
embassy = [
    "dep:ruststream-runtime-embassy",
    "ruststream-runtime-embassy/testing",
    "dep:embassy-time",
    "dep:embassy-time-driver",
    "dep:embassy-time-queue-utils",
    "dep:critical-section",
    "dep:embassy-futures",
    "dep:assert_no_alloc",
    "ruststream/embassy",
]
# `TestApp` over the compio runner's app, on the test's own compio runtime: one core, and the
# runner's virtual clock in place of compio's timers.
compio = [
    "dep:ruststream-runtime-compio",
    "ruststream-runtime-compio/testing",
    "dep:inventory",
    "dep:critical-section",
    "dep:futures",
    "ruststream/compio",
]
# The value-encoding entry points, which encode with the default codec these features select.
json = ["ruststream-runtime/json"]
cbor = ["ruststream-runtime/cbor", "ruststream/cbor"]
msgpack = ["ruststream-runtime/msgpack"]

[dependencies]
ruststream-core = { workspace = true, features = ["testing"] }
ruststream-runtime = { workspace = true, features = ["testing"] }
ruststream-runtime-tokio = { workspace = true, optional = true, features = ["testing"] }
ruststream-runtime-embassy = { workspace = true, optional = true }
ruststream-runtime-compio = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
futures = { workspace = true, optional = true, features = ["std", "async-await"] }
serde = { workspace = true, features = ["std"] }
# Lets the live injection await the publisher's pairing, whose future the contract does not
# ask to be `Send`, on a single-thread runtime: the task never leaves its thread, and the wrapper
# refuses a poll from any other. Test builds only; the cost is a thread-id comparison per poll.
send_wrapper = { version = "0.6", features = ["futures"] }
tracing = { workspace = true, features = ["std", "attributes"] }
tokio = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
# The clock a host test moves: the harness is the test build's one time driver, at embassy-time's
# microsecond tick, so it knows the deadline of every timer the app armed. Its timer queue holds
# 64 entries and keeps a timer per waker (the app's timers share the harness's one waker).
embassy-time = { workspace = true, optional = true, features = ["tick-hz-1_000_000"] }
embassy-time-driver = { version = "0.2.2", optional = true }
embassy-time-queue-utils = { version = "0.3.2", optional = true, features = ["generic-queue-64"] }
# Joins the hooks of a test's own publish with the step that polls them.
embassy-futures = { workspace = true, optional = true }
# Arms the failing allocator of a no-heap test binary around each poll of the app, and lets the
# harness's own bookkeeping through. Without a `#[global_allocator]` of its own in the binary it
# only keeps a per-thread flag, so a build with `alloc` pays a flag write per poll.
assert_no_alloc = { version = "1.1.2", optional = true }
# The driver locks through a critical section; on the host it is a process-wide mutex.
critical-section = { version = "1.1", optional = true, features = ["std"] }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The doc examples are a service's code, so they import the facade; a path dependency without a
# version is dropped on publish.
# The runtime is the one this crate's `tokio` or `embassy` feature selects.
ruststream = { path = "../ruststream", default-features = false, features = ["macros", "memory", "json", "testing"] }
# A device service's handlers and app, as the embedded tests write them.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
embassy-futures.workspace = true
# The runtime a compio test runs its `TestApp` on.
compio.workspace = true
futures-core.workspace = true
schemars = "1"
thiserror = "2"

[lints]
workspace = true

# A compio service's handler runs and acknowledges, through the compio `TestApp`.
[[test]]
name = "compio_handler"
path = "tests/compio_handler.rs"
required-features = ["compio", "json"]

# A compio service whose subscription asks for dedicated threads, through the compio `TestApp`.
[[test]]
name = "compio_threads"
path = "tests/compio_threads.rs"
required-features = ["compio", "json"]

# A compio service's reply is published, through the compio `TestApp`.
[[test]]
name = "compio_reply"
path = "tests/compio_reply.rs"
required-features = ["compio", "json"]

# The compio services of the three tests above, declared without the macros.
[[test]]
name = "compio_manual"
path = "tests/compio_manual.rs"
required-features = ["compio", "json"]

# A delayed retry of a compio service, through the compio `TestApp` and its virtual clock.
[[test]]
name = "compio_retry"
path = "tests/compio_retry.rs"
required-features = ["compio", "json"]

# What the compio `TestApp` takes for settled: the clock's waits, a long reaction, a stall.
[[test]]
name = "compio_quiescence"
path = "tests/compio_quiescence.rs"
required-features = ["compio", "json"]

# A compio shutdown that fails on a busy handler still stops it and closes the brokers.
[[test]]
name = "compio_busy"
path = "tests/compio_busy.rs"
required-features = ["compio", "json"]

# The `.error` of a compio service's failed reply, through the compio `TestApp`.
[[test]]
name = "compio_error"
path = "tests/compio_error.rs"
required-features = ["compio", "json"]

# The compio `TestApp` refuses a test runtime that fell back to polling where the environment asks
# for `io_uring`.
[[test]]
name = "compio_driver"
path = "tests/compio_driver.rs"
required-features = ["compio"]

# An app that settles, and one that cannot start, through the compio `TestApp`.
[[test]]
name = "compio_startup"
path = "tests/compio_startup.rs"
required-features = ["compio", "json"]

# A local memory broker of any capacity through the compio `TestApp`, and a broker type with no
# in-process mode.
[[test]]
name = "compio_capacity"
path = "tests/compio_capacity.rs"
required-features = ["compio", "json"]

# The compio runner reports through the logger the app selects, through the compio `TestApp`.
[[test]]
name = "compio_logger"
path = "tests/compio_logger.rs"
required-features = ["compio", "json"]

# A destination hook runs on the test's own publish, through the compio `TestApp`.
[[test]]
name = "compio_hooks"
path = "tests/compio_hooks.rs"
required-features = ["compio", "json"]

# A device service's app of one `Out` form each, through the embedded `TestApp`. Each is a binary
# of its own and sets no `recursion_limit`: the compiler lays a type out once per crate, so an app
# beside it could lay out the deepest futures first and hide how deep this one is.
[[test]]
name = "embedded_out_app"
path = "tests/embedded_out_app.rs"
required-features = ["embassy", "json"]

[[test]]
name = "embedded_out_retry_app"
path = "tests/embedded_out_retry_app.rs"
required-features = ["embassy", "json"]

[[test]]
name = "embedded_batch_out_app"
path = "tests/embedded_batch_out_app.rs"
required-features = ["embassy", "json"]

[[test]]
name = "suite"
path = "tests/main.rs"

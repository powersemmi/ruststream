# No codec feature in the list, and none missing: the message serializes itself, so the whole
# service builds with the codec layer switched off.
[[example]]
name = "protobuf"
required-features = ["testing", "macros", "memory"]

# Several message types on one subscription: a JSON model and a Protobuf one in one set.
[[example]]
name = "in_messages"
required-features = ["testing", "macros", "memory", "json"]

# The `manual_*` examples are the macro-free counterparts the guides show side by side with the
# macro form. They deliberately do not require the `macros` feature: that is what proves the
# hand-written path stands on its own.
[[example]]
name = "manual_quickstart"
path = "examples/manual/quickstart.rs"
required-features = ["memory", "json", "tokio"]

# The counterpart of `protobuf` with the derives written out: no codec feature, and no `macros`

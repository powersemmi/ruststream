required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# The `Out` slot of a handler of one message, on the build without `alloc`.
[[test]]
name = "embedded_no_alloc_out"
path = "tests/embedded_no_alloc_out.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# The `Out` slots of a batch handler, on the build without `alloc`.
[[test]]
name = "embedded_no_alloc_batch_out"
path = "tests/embedded_no_alloc_batch_out.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# A reply a naming transform sent past the fixed name room, on the build without `alloc`.
[[test]]
name = "embedded_no_alloc_name"
path = "tests/embedded_no_alloc_name.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# The size of the device build's futures, which the harness build is not.
[[test]]
name = "embedded_future_size"
path = "tests/embedded_future_size.rs"
required-features = ["embassy", "memory", "macros"]

# The brokers of this suite keep their state in `Rc`, which a multi-thread runtime refuses, so it
# is built where the Tokio runner is off.
[[test]]
name = "embedded_diagnostics"
path = "tests/embedded_diagnostics.rs"
required-features = ["embassy", "memory", "macros", "testing", "log"]

# The tokio runner reports through the logger the app selects. The selection is process-wide, so
# the test owns a binary.
[[test]]
name = "asyncapi_logger"
path = "tests/asyncapi_logger.rs"
required-features = ["tokio", "memory", "macros", "asyncapi"]

# The generator reports through the logger a compio app selects; the selection is process-wide, so
# the test owns a binary.
[[test]]
name = "asyncapi_logger_compio"
path = "tests/asyncapi_logger_compio.rs"
required-features = ["compio", "memory", "macros", "asyncapi"]

[[test]]
name = "logger_tokio_unacknowledged"
path = "tests/logger_tokio_unacknowledged.rs"
required-features = ["tokio", "memory", "macros", "testing"]

[[test]]
name = "logger_tokio"
path = "tests/logger_tokio.rs"
required-features = ["tokio", "memory", "macros", "testing", "log"]

# The embedded runner of the heap variant reports through the logger the app selects.
[[test]]
name = "embedded_diagnostics_alloc"
path = "tests/embedded_diagnostics_alloc.rs"
required-features = ["embassy", "memory", "macros", "testing", "alloc", "log", "tracing"]

# A host build with `defmt` compiled links and runs while the app selects another logger or none.
[[test]]
name = "link_defmt_unselected"
path = "tests/link_defmt_unselected.rs"
required-features = ["tokio", "memory", "macros", "testing", "defmt", "tracing"]

[[test]]
name = "ui_no_alloc"
path = "tests/ui_no_alloc.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

[[test]]
name = "local_family"
path = "tests/local_family.rs"
required-features = ["memory", "testing"]

# A firmware facade with no serde codec: a handler's `Out` slot mounts and publishes the types that
# carry their own bytes.
[[test]]
name = "local_codec_free"
path = "tests/local_codec_free.rs"
required-features = ["memory", "macros", "embassy"]

# The tests of the examples, one module per example: a binary of its own, so it compiles beside
# the suite instead of after it.
[[test]]
name = "examples"
path = "tests/examples.rs"
required-features = ["tokio"]

[package]
name = "ruststream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async messaging framework for Rust: broker-agnostic traits, router, codecs, and a conformance harness for broker authors."
readme = "../../README.md"
keywords = ["messaging", "async", "broker", "pubsub", "event-driven"]
categories = ["asynchronous", "network-programming"]
autotests = false

# The whole surface is behind features, so a default build on docs.rs publishes a reference with
# the codec, AsyncAPI, metrics, testing and conformance modules missing - the ones the guides send
# readers to. The page documents every feature, both runtimes included.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["json", "tokio"]
# The runners: `tokio` and `embassy`, alone or together. Every feature that runs on tokio's runner,
# the observability layers among them, turns `tokio` on. An app picks its runner by its type
# (`RustStream` or `EmbeddedApp`), and the handlers are the same for both.
tokio = [
    "alloc",
    "dep:ruststream-runtime-tokio",
    "dep:ruststream-cli",
    "ruststream-cli/tokio",
    "ruststream-memory?/std",
    "ruststream-testing?/tokio",
]
embassy = [
    "dep:ruststream-runtime-embassy",
    "ruststream-memory?/embassy",
    "ruststream-testing?/embassy",
]
# The compio runner: one runtime per core, on io_uring where the kernel has it.
compio = [
    "alloc",
    "dep:ruststream-runtime-compio",
    "dep:ruststream-cli",
    "ruststream-cli/compio",
    "ruststream-memory?/local",
    "ruststream-testing?/compio",
]
# The loggers an app selects with `.logger(..)`; each feature compiles its logger into the crates
# that report, and nothing is reported until the app selects one. The tokio runner turns `tracing`
# on; a heap-backed embassy app turns it on itself.
tracing = [
    "alloc",
    "ruststream-core/tracing",
    "ruststream-runtime/tracing",
]
log = [
    "ruststream-core/log",
    "ruststream-runtime/log",
    "ruststream-runtime-embassy?/log",
]
defmt = [
    "ruststream-core/defmt",
    "ruststream-runtime/defmt",
    "ruststream-runtime-embassy?/defmt",
]
# The framework's heap variant: headers, payloads, names, continuations and failures on the heap.
# Without it the embassy runtime keeps them in fixed storage and a build allocates nothing. Every
# feature that needs the heap turns it on, so a build with one of them is the heap variant
# throughout.
alloc = [
    "ruststream-macros?/alloc",
    "ruststream-core/alloc",
    "ruststream-runtime/alloc",
    "ruststream-runtime-embassy?/alloc",
    "ruststream-memory?/alloc",
    "ruststream-testing?/alloc",
]
memory = ["dep:ruststream-memory"]
conformance = ["alloc", "tokio", "testing", "dep:ruststream-conformance"]
json = [
    "alloc",
    "ruststream-core/json",
    "ruststream-runtime/json",
    "ruststream-testing?/json",
]
msgpack = ["alloc", "ruststream-runtime/msgpack", "ruststream-testing?/msgpack"]
cbor = ["alloc", "ruststream-runtime/cbor", "ruststream-testing?/cbor"]
# The slice codecs of the embassy runtime without `alloc`: `PostcardCodec` and `JsonCoreCodec`.
postcard = ["ruststream-runtime/postcard"]
json-core = ["ruststream-runtime/json-core"]
macros = ["dep:ruststream-macros"]
asyncapi = [
    "alloc",
    "tokio",
    "json",
    "dep:schemars",
    "dep:ruststream-asyncapi",
    "ruststream-core/asyncapi",
    "ruststream-runtime/asyncapi",
    "ruststream-cli/asyncapi",
    "ruststream-conformance?/asyncapi",
]
metrics = ["tokio", "dep:ruststream-observability", "ruststream-observability/metrics"]
logging = [
    "tokio",
    "dep:ruststream-observability",
    "ruststream-observability/logging",
    "ruststream-cli/logging",
]
cli = ["tokio", "dep:anyhow", "ruststream-cli/tool"]
poll-diagnostics = [
    "tokio",
    "ruststream-runtime/poll-diagnostics",
    "ruststream-runtime-tokio/poll-diagnostics",
    "ruststream-observability?/poll-diagnostics",
]
# The harness: `TestApp` over the tokio app, and `testing::embedded::TestApp` over the embedded
# app on the host.
testing = [
    "dep:inventory",
    "dep:ruststream-testing",
    "ruststream-core/testing",
    "ruststream-runtime/testing",
    "ruststream-runtime-tokio?/testing",
    "ruststream-memory?/testing",
]
otel = ["tokio", "dep:ruststream-observability", "ruststream-observability/otel"]

[dependencies]
# With a heap and no more: a device build of the embassy runtime has no standard library. A target
# that has one turns `std` on below.
ruststream-core.workspace = true
ruststream-runtime.workspace = true
ruststream-runtime-tokio = { workspace = true, optional = true }
ruststream-runtime-embassy = { workspace = true, optional = true }
ruststream-runtime-compio = { workspace = true, optional = true }
ruststream-memory = { workspace = true, optional = true }
ruststream-asyncapi = { workspace = true, optional = true }
ruststream-observability = { workspace = true, optional = true }
ruststream-testing = { workspace = true, optional = true }
ruststream-cli = { workspace = true, optional = true }
ruststream-conformance = { workspace = true, optional = true }
ruststream-macros = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }


# Every file under `tests/` is a module of one test binary: one link instead of one per file.
[[test]]
name = "suite"
path = "tests/main.rs"
required-features = ["tokio"]

# The device service the embedded runtime page teaches: the excerpts of the page are its regions.
[[test]]
name = "doc_device"
path = "tests/doc_device.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# A device service's deliveries under an allocator that fails the framework's own allocations,
# built where the framework's `alloc` feature is off.
[[test]]
name = "embedded_no_alloc"
path = "tests/embedded_no_alloc.rs"
required-features = ["embassy", "memory", "macros", "testing"]

# Batch routes written with the attributes, built without a `recursion_limit`, on the build
# without `alloc`.
[[test]]
name = "embedded_no_alloc_batch"
path = "tests/embedded_no_alloc_batch.rs"
required-features = ["embassy", "memory", "macros", "testing", "postcard"]

# A batch handler that takes values the mount's codec decodes, on the build without `alloc`.

[dev-dependencies]
futures = "0.3"
# The runtime a compio example's test runs its `TestApp` on.
compio.workspace = true
# The thread-mode executor of the `std` platform, which the app attribute's task runs on in the
# embedded batch gate. It does not turn `alloc` on.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
thiserror = "2"
tracing = "0.1.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Registrations on the manual path are documented by default, so an example's message types
# derive `JsonSchema` whether or not the example itself turns the `asyncapi` feature on (the
# crate re-exports `schemars` only under that feature).
schemars = "1"
# 1.49 for the tests alone: they tell the app's runtime from a dedicated thread's by
# `Handle::id`, which is stable from there on.
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }
axum = "0.8"
# The custom-codec examples build their codec over it.
rmp-serde = "1"
# The HTTP guide examples join the server's tasks with it.
tokio-util = { version = "0.7.10", features = ["rt"] }
# The metrics tests and examples read the registry the layers record into.
prometheus = { version = "0.14", default-features = false }
trybuild = "1"
# The one real generator behind `#[wire(prost)]`. It is a dev-dependency and nothing else: the
# shorthand expands to paths in this crate, so the only way to know the expansion type-checks
# against the real trait is to compile a message against it. No `prost-build` and no `protoc`:
# the test writes out what a generator's `message_attribute` config would have emitted.
prost = "0.14"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio", "testing"] }
gungraun = "=0.20.0"
divan = "0.1.21"
# The poll-diagnostics suite reads the warning the way an operator does: as a formatted log line.
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "std"] }
# Counts this thread's allocations around a publish, so a test reads what one costs.
allocation-counter = "0.8.1"
# The failing allocator of the no-heap leg: it aborts an allocation made inside a guarded closure,
# and lets through one made inside a permitted section.
assert_no_alloc = "1.1.2"
embassy-time.workspace = true
# The executor and joins the embedded benchmark drives the app with.
embassy-futures.workspace = true
# The critical section the embedded benchmark locks through, a process-wide mutex on a host.
critical-section = { version = "1.1", features = ["std"] }
# The byte buffers the examples and tests write codecs against; the facade re-exports its own
# through the contract, which brings them in the heap variant only.
bytes = { workspace = true, features = ["std"] }
bytes-utils = { workspace = true, features = ["std"] }
# The sink the diagnostics test reads the records of a build without `alloc` from.
log = { workspace = true, features = ["std"] }
# Builds the examples' tests into one test binary (`tests/examples.rs`) instead of a test
# binary per example. Unpublished: a path dev-dependency without a version is dropped on publish.
ruststream-example-suite = { path = "../../checks/ruststream-example-suite" }

[lints]
workspace = true

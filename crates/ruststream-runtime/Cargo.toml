[package]
name = "ruststream-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The delivery body of the RustStream messaging framework, shared by every runner: router, dispatch, publishing and codecs; services use it through `ruststream`."
keywords = ["messaging", "async", "broker", "pubsub", "ruststream"]
categories = ["asynchronous", "network-programming"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# The delivery body itself: routing, dispatch, publishing and settlement keep headers, payloads,
# names and boxed errors on the heap. A `no_std` build with an allocator turns on this feature
# alone; without it the crate holds the traits a runner implements.
alloc = [
    "ruststream-core/alloc",
    "dep:bytes",
    "dep:bytes-utils",
    "dep:futures",
    "futures/alloc",
    "dep:serde",
    "serde/alloc",
    "dep:thiserror",
    "dep:tracing",
    "tracing/attributes",
    "dep:pin-project-lite",
]
# The standard library's side of the body and of its dependencies: the panic policy's catching
# part, the mutex-backed broker wrapper, and every feature below that reaches the standard library.
std = [
    "alloc",
    "ruststream-core/std",
    "bytes/std",
    "bytes-utils/std",
    "futures/std",
    "serde/std",
    "thiserror/std",
    "tracing/std",
]
# The codecs. Their writer follows the target: `std::io::Write` wherever the standard library
# exists, whatever the features. On a bare-metal target CBOR writes through its own writer trait,
# JSON through `serde-json-slice`'s, and MessagePack has no writer there and fails the build with a
# message saying so.
json = [
    "alloc",
    "dep:serde_json",
    "serde_json/alloc",
    "dep:serde-json-slice",
    "ruststream-core/json",
]
msgpack = ["alloc", "dep:rmp-serde"]
cbor = ["alloc", "dep:ciborium", "dep:ciborium-io"]
# Payload and header schemas for the generated document, and the binding types of the contract.
asyncapi = ["std", "json", "dep:schemars", "ruststream-core/asyncapi"]
# The handler result the Prometheus layer reads, and the poll-time diagnostics counters it exports.
metrics = ["alloc"]
# The decode-failure flag and the batch-size histogram the OpenTelemetry layers read.
otel = ["std", "dep:opentelemetry"]
# The in-process dispatch the test harness drives, and the broker contract of that harness.
testing = [
    "std",
    "dep:inventory",
    "dep:tokio",
    "dep:tokio-util",
    "tokio/macros",
    "tokio/sync",
    "tokio/time",
    "tokio/test-util",
    "ruststream-core/testing",
]
# The app's runtime as a handler reaches it (`MainRuntime`), for the runner built on Tokio.
tokio = ["std", "dep:tokio"]
poll-diagnostics = ["std", "dep:quanta", "dep:pin-project-lite"]

[dependencies]
ruststream-core.workspace = true
bytes = { workspace = true, optional = true }
bytes-utils = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
# The handle of the app's runtime under the `tokio` feature, and the harness's coordinator under
# `testing`; the delivery body itself names no runtime. Only `rt`: the body spawns nothing.
tokio = { version = "1.44", optional = true, default-features = false, features = ["rt"] }
tokio-util = { workspace = true, optional = true }
quanta = { workspace = true, optional = true }
pin-project-lite = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
ciborium = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }

# Every target with an operating system has the standard library, and the codecs write through it
# there. `rmp-serde` builds only with it, so a bare-metal target leaves it out and the `msgpack`
# feature reports why instead of failing inside it.
[target.'cfg(not(target_os = "none"))'.dependencies]
serde_json = { workspace = true, optional = true, features = ["std"] }
ciborium = { workspace = true, optional = true, features = ["std"] }
rmp-serde = { workspace = true, optional = true }

# The writer traits CBOR and JSON encode through on a bare-metal target.
[target.'cfg(target_os = "none")'.dependencies]
ciborium-io = { version = "0.2.1", optional = true, default-features = false }
serde-json-slice = { version = "0.1.0", optional = true, default-features = false }

[dev-dependencies]
# Counts this thread's allocations, so a test reads what a batch costs.
allocation-counter = "0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The bare-metal JSON encoder, built on the host so its tests run there.
serde-json-slice = "0.1.0"
schemars = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }
tokio-util = { version = "0.7.10", features = ["rt"] }
# The doc examples decode a Protobuf message on a byte lane.
prost = "0.14"
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "std", "registry"] }
# The doc examples are a service's code, so they import the facade; the unit tests reach the
# in-memory broker through it. A path dependency without a version is dropped on publish.
ruststream = { path = "../..", features = ["macros", "memory", "json", "asyncapi", "testing", "conformance", "poll-diagnostics", "metrics", "otel"] }
# The local family's doc examples mount on the local in-memory broker.
ruststream-memory = { path = "../ruststream-memory", features = ["embassy"] }

[lints]
workspace = true

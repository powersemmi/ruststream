[package]
name = "ruststream-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The broker contract of the RustStream messaging framework; services and broker crates use it through `ruststream`."
keywords = ["messaging", "async", "broker", "pubsub", "ruststream"]
categories = ["asynchronous", "network-programming"]
readme = "../../README.md"
# Lets the crates that depend on the contract read, in their build scripts, whether it was built
# with `alloc`: a build has one variant throughout, whatever features each crate asked for.
links = "ruststream-core"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# The contract itself: its headers, payloads, names and errors live on the heap, so every trait and
# message type needs it. A `no_std` build with an allocator turns on this feature alone.
#
# It also brings the heap dependencies the rest of the family needs in its heap variant (`bytes`,
# `bytes-utils`, `tracing`, `futures` with its own `alloc`) and hands them to
# the other crates through a hidden module, so a crate that turns this feature on is enough: the
# family's other crates need no feature of their own to follow it.
alloc = [
    "dep:bytes",
    "dep:bytes-utils",
    "serde/alloc",
    "tracing",
    "dep:futures",
    "futures/alloc",
]
# The standard library's side of the dependencies, and the broker wrapper `Bindable`, whose slot is
# a `std` mutex.
std = [
    "alloc",
    "bytes/std",
    "bytes-utils/std",
    "serde/std",
    "thiserror/std",
    "serde_json?/std",
    "tracing?/std",
    "futures?/std",
]
# Where the framework's diagnostics go. A build with `tracing` reports through it and no other sink;
# the others serve a build without `alloc`: `log` for a host or a board with a logger, `defmt` for a
# board with a probe (both may be on). With none of them a diagnostic is type-checked and dropped.
tracing = ["dep:tracing"]
log = ["dep:log"]
defmt = ["dep:defmt"]
# `Send` (and `Sync`) on the futures and the implementors of the contract traits, for a runtime that
# moves work between threads. Without it the same traits ask nothing of the sort, and an embedded
# runtime implements them with types that hold `Rc` or `RefCell`.
send = []
# `SecurityScheme::oauth2` and `SecurityScheme::custom` take a JSON value.
json = ["alloc", "dep:serde_json", "serde_json/alloc"]
# The `*_bindings` methods of the contract and the binding types they return.
asyncapi = ["json"]
# The hook a `Bound` token pairs through, which the test harness reads: a tokio task-local, so the
# harness's side of the contract runs on a host.
testing = ["dep:tokio", "dep:bytes", "dep:bytes-utils", "bytes/std", "bytes-utils/std"]

[dependencies]
bytes = { workspace = true, optional = true }
bytes-utils = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-core.workspace = true
heapless.workspace = true
serde.workspace = true
serde_json = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
log = { workspace = true, optional = true }
defmt = { workspace = true, optional = true }

[dev-dependencies]
futures.workspace = true
serde_json = "1"
tracing.workspace = true
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The doc examples are a service's code, so they import the facade; a path dependency without a
# version is dropped on publish.
ruststream = { path = "../..", features = ["macros", "memory", "json", "asyncapi", "testing"] }

[lints]
workspace = true

[package]
name = "ruststream-memory"
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The in-memory broker of the RustStream messaging framework, its reference broker; services use it through `ruststream`."
keywords = ["messaging", "async", "broker", "pubsub", "ruststream"]
categories = ["asynchronous", "network-programming"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# `MemoryBroker`, the broker on tokio's channels and clock.
std = [
    "alloc",
    "ruststream-core/std",
    "dep:ruststream-runtime",
    "ruststream-runtime/std",
    "dep:futures",
    "futures/std",
    "futures/async-await",
    "futures/executor",
    "dep:serde",
    "serde/std",
    "thiserror/std",
    "dep:tokio",
    "dep:critical-section",
    "critical-section/std",
]
# The heap variant of the framework: the buses keep their messages in `bytes` buffers and on
# the heap. Without it the local bus is a fixed one, a `static` the board declares.
alloc = ["ruststream-core/alloc", "ruststream-runtime?/alloc"]
# `LocalMemoryBroker`, the broker on embassy-sync's primitives: it builds without `std`, on any
# executor. With `alloc` its bus lives on the heap, without it the bus is a `static` of fixed size.
embassy = [
    "dep:ruststream-runtime",
    "dep:embassy-sync",
    "dep:futures-core",
    "dep:heapless",
    "dep:static_cell",
]
# The in-process transport the test harness drives the broker through. It does not turn the
# framework's `alloc` on: the fixed local bus keeps its publish log in the harness's own
# bookkeeping, which runs in a section the failing allocator of a no-heap test lets through.
# The name the compio runner's users enable the same broker under.
local = ["embassy"]
testing = [
    "ruststream-runtime/testing",
    "ruststream-core/testing",
    "dep:assert_no_alloc",
]

[dependencies]
ruststream-core.workspace = true
ruststream-runtime = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
heapless = { workspace = true, optional = true }
# Hands each place of the fixed bus's `static` to its subscription once, as a `&'static mut`: a
# compare-and-swap per place at the first connect, nothing per delivery. Where the target has no
# compare-and-swap (a Cortex-M0+), the firmware gives `portable-atomic` its `critical-section`
# feature or its single-core option.
static_cell = { version = "2.1.1", optional = true }
critical-section = { version = "1.1", optional = true }
# Marks the harness's bookkeeping inside a poll as the harness's, not the framework's.
assert_no_alloc = { version = "1.1.2", optional = true }
futures = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }

[dev-dependencies]
# The doc examples log through it.
tracing.workspace = true
# Counts this thread's allocations, so a test reads what a publish costs.
allocation-counter = "0.8.1"
# Drives the local broker's examples and tests: a device's executor polls the same futures.
embassy-futures.workspace = true
futures = { workspace = true, features = ["std"] }
ruststream-conformance = { path = "../conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The doc examples are a service's code, so they import the facade; a path dependency without a
# version is dropped on publish.
ruststream = { path = "../ruststream", features = ["macros", "memory", "json", "testing"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/main.rs"

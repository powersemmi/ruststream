[package]
name = "ruststream-runtime-embassy"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The embedded runner of the RustStream messaging framework: a service's app on embassy's executor and clock, with or without a heap."
keywords = ["messaging", "embedded", "embassy", "no-std", "ruststream"]
categories = ["asynchronous", "embedded", "no-std"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[dependencies]
ruststream-core = { workspace = true, features = ["alloc"] }
ruststream-runtime = { workspace = true, features = ["alloc"] }
futures-core.workspace = true
# The clock a device reads. The driver is the binary's choice: a host test picks the mock driver.
embassy-time.workspace = true
# The channels and wakers the runner keeps, all without a heap.
embassy-sync.workspace = true
heapless.workspace = true

[dev-dependencies]
# The thread-mode executor of the `std` platform: the executor a device runs, hosted on a thread.
# Its integrated timer queue keeps each timer in the task that awaits it, so every timer the body
# arms must be polled with an embassy task's own waker.
embassy-executor = { workspace = true, features = ["platform-std", "executor-thread"] }
# The clock the test moves by hand. The executor's integrated timer queue serves it, so no
# `generic-queue-N` feature is named.
embassy-time = { workspace = true, features = ["mock-driver"] }
embassy-futures.workspace = true
# The mock driver and the shutdown's waker list lock through a critical section; on a host it is a
# process-wide mutex.
critical-section = { version = "1.1", features = ["std"] }
static_cell = "2.1"
# Counts the process's allocations so the test reads what one delivery made: four atomic
# counters per allocation, in the test binary only.
stats_alloc = "0.1.10"

# The executor owns the thread it runs on, and the mock clock is one per process, so the test is a
# binary of its own with no test harness: it passes when the executor returns.
[[test]]
name = "embassy"
path = "tests/embassy.rs"
harness = false

[lints]
workspace = true

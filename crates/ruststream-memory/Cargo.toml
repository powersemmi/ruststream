[package]
name = "ruststream-memory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "The in-memory broker of the RustStream messaging framework, its reference broker; services use it through `ruststream`."
keywords = ["messaging", "async", "broker", "pubsub", "ruststream"]
categories = ["asynchronous", "network-programming"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
default = ["std"]
# `MemoryBroker`, the broker on tokio's channels and clock.
std = [
    "ruststream-core/std",
    "dep:ruststream-runtime",
    "ruststream-runtime/std",
    "bytes/std",
    "dep:bytes-utils",
    "bytes-utils/std",
    "dep:futures",
    "futures/std",
    "futures/async-await",
    "futures/executor",
    "dep:serde",
    "serde/std",
    "thiserror/std",
    "dep:tokio",
    "dep:tracing",
    "tracing/std",
    "tracing/attributes",
]
# `LocalMemoryBroker`, the broker on embassy-sync's channels: it builds without `std`, on any
# executor, with an allocator.
embassy = [
    "ruststream-core/alloc",
    "dep:ruststream-runtime",
    "ruststream-runtime/alloc",
    "dep:embassy-sync",
    "dep:futures-core",
]
# The in-process transport the test harness drives the broker through.
testing = ["std", "ruststream-runtime/testing", "ruststream-core/testing"]

[dependencies]
ruststream-core.workspace = true
ruststream-runtime = { workspace = true, optional = true }
bytes.workspace = true
bytes-utils = { workspace = true, optional = true }
embassy-sync = { workspace = true, optional = true }
futures = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
serde = { workspace = true, optional = true }
thiserror.workspace = true
tokio = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
# Drives the local broker's examples and tests: a device's executor polls the same futures.
embassy-futures.workspace = true
futures = { workspace = true, features = ["std"] }
ruststream-conformance = { path = "../ruststream-conformance" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
# The doc examples are a service's code, so they import the facade; a path dependency without a
# version is dropped on publish.
ruststream = { path = "../..", features = ["macros", "memory", "json", "testing"] }

[lints]
workspace = true

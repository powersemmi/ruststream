[package]
name = "ruststream-macros"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Procedural macros for the RustStream messaging framework."
readme = "README.md"
keywords = ["messaging", "async", "macros", "ruststream"]
categories = ["asynchronous", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote = "1"
# `visit-mut` rewrites elided lifetimes in input types (the `Deserialized` view spellings).
syn = { version = "3", features = ["full", "visit-mut"] }

[lints]
workspace = true

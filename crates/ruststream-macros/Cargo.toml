[package]
name = "ruststream-macros"
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Procedural macros for the RustStream messaging framework."
readme = "README.md"
keywords = ["messaging", "async", "macros", "ruststream"]
categories = ["asynchronous", "development-tools::procedural-macro-helpers"]

[lib]
proc-macro = true

[features]
# The framework's heap variant: the declared messages are described for the generated document,
# which only that variant builds.
alloc = []

[dependencies]
proc-macro2 = "1"
quote = "1"
# `visit-mut` rewrites elided lifetimes in input types (the `Deserialized` view spellings).
syn = { version = "3", features = ["full", "visit-mut"] }

[dev-dependencies]
# The expansions are tested the way a service meets them: through the facade.
ruststream = { path = "../ruststream", features = ["macros", "memory", "json", "testing"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/main.rs"

[package]
name = "ruststream-observability"
# Every file under `tests/` is a module of one test binary: one link instead of one per file.
autotests = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Prometheus metrics, logging and OpenTelemetry layers for the RustStream messaging framework; services use them through `ruststream`."
keywords = ["messaging", "metrics", "opentelemetry", "logging", "ruststream"]
categories = ["asynchronous", "development-tools::debugging"]
readme = "../../README.md"

[package.metadata.docs.rs]
all-features = true

[features]
# The Prometheus layers.
metrics = ["dep:prometheus", "dep:arc-swap", "dep:boxcar", "ruststream-runtime/metrics"]
# The `tracing` subscriber a service installs at startup.
logging = ["dep:tracing-subscriber"]
# The OpenTelemetry propagation, export and dispatch metrics.
otel = [
    "dep:arc-swap",
    "dep:boxcar",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
    "ruststream-runtime/otel",
]
# The poll-time histograms the metrics layers export.
poll-diagnostics = ["ruststream-runtime/poll-diagnostics"]

[dependencies]
ruststream-core = { workspace = true, features = ["std"] }
ruststream-runtime = { workspace = true, features = ["std"] }
ruststream-runtime-tokio.workspace = true
thiserror = { workspace = true, features = ["std"] }
tracing = { workspace = true, features = ["std", "attributes"] }
prometheus = { workspace = true, optional = true }
arc-swap = { workspace = true, optional = true }
boxcar = { workspace = true, optional = true }
tracing-subscriber = { workspace = true, optional = true }
opentelemetry = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "test-util"] }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio", "testing"] }
# The doc examples are a service's code, so they import the facade; a path dependency without a
# version is dropped on publish.
ruststream = { path = "../ruststream", features = ["macros", "memory", "json", "testing", "metrics", "logging", "otel"] }
allocation-counter = "0.8.1"
schemars = "1"

[lints]
workspace = true

[[test]]
name = "suite"
path = "tests/main.rs"

# The OpenTelemetry metrics own their process: `init()` installs the global tracing subscriber
# and providers, and the batch-size histogram binds to the global meter at the first batch the
# process dispatches, so a test running beside them would decide what they observe.
[[test]]
name = "otel_metrics"
path = "tests/otel_metrics.rs"

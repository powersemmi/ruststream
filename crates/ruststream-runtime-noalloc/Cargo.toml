[package]
name = "ruststream-runtime-noalloc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
description = "The delivery body without `alloc`, built from the runtime's own sources so its in-crate tests run: the runtime's dev-dependencies turn `alloc` on."
publish = false
build = "../ruststream-runtime/build.rs"

# A workspace of its own: a member of the main workspace would unify `alloc` on through its
# neighbours, which is the one thing this crate exists to avoid.
[workspace]

[lib]
name = "ruststream_runtime_noalloc"
path = "../ruststream-runtime/src/lib.rs"

[features]
default = []
postcard = ["dep:postcard"]
json-core = ["dep:serde-json-core"]

[dependencies]
ruststream-core = { path = "../ruststream-core", default-features = false }
futures = { version = "0.3", default-features = false }
serde = { version = "1.0.69", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }
tracing = { version = "0.1.29", default-features = false, features = ["attributes"] }
pin-project-lite = "0.2"
dyn-utils = { version = "0.1.1", default-features = false, features = ["macros"] }
heapless = { version = "0.9", default-features = false }
postcard = { version = "1.1.3", optional = true, default-features = false }
serde-json-core = { version = "0.7.0", optional = true, default-features = false }

[dev-dependencies]
# Counts this thread's allocations, so a test reads what a delivery costs.
allocation-counter = "0.8.1"
trybuild = "1"

# The sources are the runtime's, and name features this build never has.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("alloc", "asyncapi", "cbor", "json", "macros", "memory", "metrics", "msgpack", "otel", "poll-diagnostics", "std", "testing", "tokio"))'] }

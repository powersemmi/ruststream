[package]
name = "ruststream-memory-noalloc"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
description = "The local bus without `alloc`, built from the memory crate's own sources so its in-crate tests and doc examples run: that crate's dev-dependencies turn `alloc` on."
publish = false
build = "../../../crates/memory/build.rs"

[lib]
name = "ruststream_memory"
path = "../../../crates/memory/src/lib.rs"

[features]
default = ["embassy"]
embassy = []
# The harness side of the fixed bus: it keeps a publish log, so it links `alloc` beside the
# framework without turning the framework's `alloc` feature on.
testing = [
    "ruststream-runtime/testing",
    "ruststream-core/testing",
    "dep:assert_no_alloc",
    "dep:bytes",
]

[dependencies]
ruststream-core = { path = "../../../crates/core", default-features = false }
ruststream-runtime = { path = "../../../crates/runtime", default-features = false }
embassy-sync = "0.8"
futures-core = { version = "0.3", default-features = false }
heapless = { version = "0.9", default-features = false }
thiserror = { version = "2", default-features = false }
assert_no_alloc = { version = "1.1.2", optional = true }
bytes = { version = "1", optional = true, default-features = false }

[dev-dependencies]
embassy-futures = "0.1.2"
futures = { version = "0.3", default-features = false }
critical-section = { version = "1.1", features = ["std"] }
# Counts this thread's allocations, so a test reads that a publish costs none.
allocation-counter = "0.8.1"
# The local suites of the contract, run against the fixed bus (`tests/`, under `testing`).
ruststream-conformance = { path = "../../../crates/conformance", default-features = false }
tokio = { version = "1.49", features = ["rt", "macros", "time", "test-util"] }

# The sources are the memory crate's, and name features this build never has.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("alloc", "std", "testing"))'] }

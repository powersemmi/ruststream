# Every file under `tests/` is a module of one test binary: one link instead of one per file.
[[test]]
name = "suite"
path = "tests/main.rs"

# The tests of the examples, one module per example: a binary of its own, so it compiles beside
# the suite instead of after it.
[[test]]
name = "examples"
path = "tests/examples.rs"

# The OpenTelemetry metrics own their process: `init()` installs the global tracing subscriber
# and providers, and the batch-size histogram binds to the global meter at the first batch the
# process dispatches, so a test running beside them would decide what they observe.
[[test]]
name = "otel_metrics"
path = "tests/otel_metrics.rs"

[package]
name = "ruststream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async messaging framework for Rust: broker-agnostic traits, router, codecs, and a conformance harness for broker authors."
readme = "README.md"
keywords = ["messaging", "async", "broker", "pubsub", "event-driven"]
categories = ["asynchronous", "network-programming"]
autotests = false

# The whole surface is behind additive features, and `default` is `json` alone, so a default build
# on docs.rs publishes a reference with the runtime, codec, AsyncAPI, metrics, testing and
# conformance modules missing - the ones the guides send readers to.
[package.metadata.docs.rs]
all-features = true

[features]
default = ["json"]
memory = ["dep:ruststream-memory"]
conformance = ["testing", "dep:ruststream-conformance"]
json = [
    "ruststream-core/json",
    "ruststream-runtime/json",
    "ruststream-testing?/json",
]
msgpack = ["ruststream-runtime/msgpack", "ruststream-testing?/msgpack"]
cbor = ["ruststream-runtime/cbor", "ruststream-testing?/cbor"]
macros = ["dep:ruststream-macros"]
asyncapi = [
    "json",
    "dep:schemars",
    "dep:ruststream-asyncapi",
    "ruststream-core/asyncapi",
    "ruststream-runtime/asyncapi",
    "ruststream-cli/asyncapi",
    "ruststream-conformance?/asyncapi",
]
metrics = ["dep:ruststream-observability", "ruststream-observability/metrics"]
logging = [
    "dep:ruststream-observability",
    "ruststream-observability/logging",
    "ruststream-cli/logging",
]
cli = ["dep:anyhow", "ruststream-cli/tool"]
poll-diagnostics = [
    "ruststream-runtime/poll-diagnostics",
    "ruststream-observability?/poll-diagnostics",
]
testing = [
    "dep:inventory",
    "dep:ruststream-testing",
    "ruststream-core/testing",
    "ruststream-runtime/testing",
    "ruststream-memory?/testing",
]
otel = ["dep:ruststream-observability", "ruststream-observability/otel"]

[dependencies]
ruststream-core.workspace = true
ruststream-runtime.workspace = true
ruststream-memory = { workspace = true, optional = true }
ruststream-asyncapi = { workspace = true, optional = true }
ruststream-observability = { workspace = true, optional = true }
ruststream-testing = { workspace = true, optional = true }
ruststream-cli.workspace = true
ruststream-conformance = { workspace = true, optional = true }
bytes.workspace = true
bytes-utils.workspace = true
ruststream-macros = { workspace = true, optional = true }
schemars = { workspace = true, optional = true }
anyhow = { workspace = true, optional = true }
inventory = { workspace = true, optional = true }

# One scenario per file; `benches/common` is the shared setup. `just bench` names them, so a new
# file is added in two places and `scripts/bench_results.py` fails loudly when one of them is
# missed.
[[bench]]
name = "consume_json"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "consume_json_kilobyte"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "consume_lane"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "consume_pool"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "consume_threads"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "middleware"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "batch"
harness = false
required-features = ["memory", "json", "macros"]

[[bench]]
name = "reply"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Registrations on the manual path are documented by default, so an example's message types
# derive `JsonSchema` whether or not the example itself turns the `asyncapi` feature on (the
# crate re-exports `schemars` only under that feature).
schemars = "1"
# 1.49 for the tests alone: they tell the app's runtime from a dedicated thread's by
# `Handle::id`, which is stable from there on.
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }
axum = "0.8"
trybuild = "1"
# The one real generator behind `#[wire(prost)]`. It is a dev-dependency and nothing else: the
# shorthand expands to paths in this crate, so the only way to know the expansion type-checks
# against the real trait is to compile a message against it. No `prost-build` and no `protoc`:
# the test writes out what a generator's `message_attribute` config would have emitted.
prost = "0.14"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio", "testing"] }
gungraun = "=0.20.0"
divan = "0.1.21"
# The poll-diagnostics suite reads the warning the way an operator does: as a formatted log line.
tracing-subscriber = { version = "0.3.22", default-features = false, features = ["fmt", "std"] }

# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"

# One lint table for both crates of the workspace, so the macros crate is held to what the
# runtime crate is held to.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# Imports: a name is imported once, at the top of the file.
redundant_imports = "warn"
unused_import_braces = "warn"
# Dead and redundant code: casts, lifetimes and macro arms that change nothing.
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
cognitive_complexity = "warn"
# Imports: a path is brought into scope with `use`, never spelled out inline.
absolute_paths = "warn"
alloc_instead_of_core = "warn"
unnecessary_self_imports = "warn"
# Panics: library code returns its errors; tests may unwrap.
unwrap_used = "warn"
unwrap_in_result = "warn"
missing_assert_message = "warn"
string_slice = "warn"
# Numbers: big endian, the network order, on the wire.
little_endian_bytes = "warn"
non_zero_suggestions = "warn"

[lints]
workspace = true

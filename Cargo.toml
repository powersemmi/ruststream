[workspace]
members = [
    "crates/ruststream",
    "crates/core",
    "crates/runtime",
    "crates/runtime-tokio",
    "crates/runtime-compio",
    "crates/memory",
    "crates/asyncapi",
    "crates/observability",
    "crates/testing",
    "crates/cli",
    "crates/conformance",
    "crates/macros",
    "checks/example-suite",
    "crates/runtime-embassy",
]
# A bare cargo command at the root builds the facade, the crate a service depends on.
default-members = ["crates/ruststream"]
resolver = "3"
# `templates/` holds cargo-generate scaffolds (rendered by `cargo generate`, not built here): their
# sources carry `{{project-name}}` placeholders that are not valid Rust/TOML until rendered, so they
# must stay out of the workspace. `exclude` alone is not enough: cargo's git-source package
# discovery ignores it and parses every `Cargo.toml` in the repository, which is why the scaffold
# manifests are named `Cargo.toml.liquid` (cargo-generate drops the suffix when it renders them).
exclude = ["templates"]

[workspace.package]
version = "0.8.0-rc.2"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
homepage = "https://powersemmi.github.io/ruststream/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
# The contract builds without `std`, so these take no default features here; each crate that needs
# `std` from them names it.
bytes = { version = "1.9", default-features = false }
# The owned string of the message path: a `Bytes` with the UTF-8 invariant, so a name and a header
# key clone by reference count and can be sliced out of a buffer a broker already holds.
# 0.1.3 is the real floor: `Str::from_static`, which is how a constant key costs nothing, arrived
# there.
bytes-utils = { version = "0.1.3", default-features = false }
# The combinators of the delivery body, which builds without `std`; each crate that needs `std` or
# the default features names them.
futures = { version = "0.3", default-features = false }
# The `Stream` trait the contract names, without the rest of `futures` and without `std`.
futures-core = { version = "0.3", default-features = false }
# The preallocated queue a batch pool's workers report themselves idle through: a push and a pop
# are one compare-and-swap each, and nothing allocates after construction.
crossbeam-queue = "0.3.14"
# The ring that feeds each dedicated thread of a `threads(n)` subscription: a preallocated SPSC
# ring whose push and pop are a store each. 0.3.5 is the release whose costs were read.
rtrb = "0.4.0"
# 1.0.69 is the real floor: the typed-headers deserializer names `BorrowedStrDeserializer` and
# forwards the 128-bit methods, both of which arrived there.
serde = { version = "1.0.69", default-features = false, features = ["derive"] }
thiserror = { version = "2", default-features = false }

# 1.44 is the real floor: a `threads(n)` thread yields through `task::coop::consume_budget`, which
# landed there.
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# 0.7.10 is the real floor: `TaskTracker`, which the runtime uses to join spawned handlers,
# landed there, so nothing below it ever compiled here.
tokio-util = { version = "0.7.10", features = ["rt"] }
# 0.1.29 is the real floor: it is the first release whose own `tracing-core` bound reaches 0.1.21,
# where `Value` for `Option<T>` landed - the dispatch spans record optional fields.
tracing = { version = "0.1.29", default-features = false }
# The records of a build without `alloc`: `log` for a host or a board with a logger, `defmt` for a
# board with a probe. Both are optional features of the contract crate, picked by the service.
log = { version = "0.4.21", default-features = false }
defmt = "1"
# The cycle counter the poll-time diagnostics read: `rdtsc` on x86_64 with an invariant TSC, the
# system counter on aarch64, the monotonic clock elsewhere.
quanta = "0.13.0"
pin-project-lite = "0.2"

# The compio runner: one runtime per core. The pin is a beta and moves to 0.20 final when it
# ships (0.x releases break on the minor); the default driver is io-uring on Linux and polling elsewhere.
compio = { version = "=0.20.0-beta.1", features = ["time", "signal"] }
# The parked wait of a shutdown: one `Event` that every core's loop listens on.
event-listener = "5.4"
# The embedded runner. Every one builds without `std`; a device binary picks the executor's
# platform and the time driver, a host test picks `platform-std` and the mock driver.
embassy-executor = "0.10"
embassy-futures = "0.1.2"
embassy-sync = "0.8"
embassy-time = "0.5.1"
# Fixed-capacity collections: the embedded runner's headers, frames and pending stores.
heapless = { version = "0.9", default-features = false }
# Type-level numbers: the embedded runner compares a store's capacity with a batch's size at compile
# time, with a message that names both.
typenum = { version = "1.20", features = ["const-generics"] }
# The room a continuation lives in on a device without a heap: a trait object stored in place,
# whose capture size is checked when the code is built. No allocation, `no_std`.
dyn-utils = { version = "0.1.1", default-features = false }

# Exact pin: the two crates release in lockstep and the proc-macro surface tracks the library
# release for release (a loose range let a partial `cargo update` pair a new core with an old
# macros crate and fail to compile). Bumped by the same edit as [workspace.package].version.
ruststream-macros = { version = "=0.8.0-rc.2", path = "crates/macros" }
# The crates the facade re-exports, pinned exactly for the same reason as the macros crate.
ruststream-core = { version = "=0.8.0-rc.2", path = "crates/core", default-features = false }
ruststream-runtime = { version = "=0.8.0-rc.2", path = "crates/runtime", default-features = false }
ruststream-runtime-tokio = { version = "=0.8.0-rc.2", path = "crates/runtime-tokio" }
ruststream-runtime-embassy = { version = "=0.8.0-rc.2", path = "crates/runtime-embassy" }
ruststream-runtime-compio = { version = "=0.8.0-rc.2", path = "crates/runtime-compio" }
# Without its default `std`: the facade's runtime feature picks the tokio side or the embassy side.
ruststream-memory = { version = "=0.8.0-rc.2", path = "crates/memory", default-features = false }
ruststream-asyncapi = { version = "=0.8.0-rc.2", path = "crates/asyncapi" }
ruststream-observability = { version = "=0.8.0-rc.2", path = "crates/observability" }
ruststream-testing = { version = "=0.8.0-rc.2", path = "crates/testing" }
ruststream-cli = { version = "=0.8.0-rc.2", path = "crates/cli", default-features = false }
ruststream-conformance = { version = "=0.8.0-rc.2", path = "crates/conformance" }
# 0.3.22 is the real floor, not 0.3: `tracing-opentelemetry` 0.34 requires `^0.3.22`, so the
# `otel` feature never resolved anything lower, and the declared bound claimed years of releases
# that were never built against.
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde_json = { version = "1", default-features = false }
rmp-serde = "1"
# 0.2.1 is the real floor: the crate-root `into_writer`/`from_reader` re-exports the CBOR codec
# calls arrived in that release.
ciborium = { version = "0.2.1", default-features = false }
prometheus = { version = "0.14", default-features = false }
# The metric layers' per-destination entries: an index replaced whole on a new name, read with no
# lock, over an append-only vector whose entries stay put while a publish holds one.
arc-swap = "1.7"
boxcar = "0.2.14"
schemars = "1"
serde_norway = "0.9"
clap = { version = "4", features = ["derive"] }
# 1.0.1 is the real floor: `bail!` with a formatted message does not compile against 1.0.0.
anyhow = "1.0.1"
# 0.3.5 is the real floor: earlier 0.3 releases lose the broker registrations to a plain GNU ld,
# so the registry comes back empty and the harness reports no transport for a broker that did
# register. Development setups on mold or lld happen to hide it.
inventory = "0.3.5"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.34"


# What ships is optimized across crate boundaries: the framework is generic to the point where a
# dispatch path is only as cheap as the inlining it gets, and a build that stops at each crate
# boundary is not the one to publish numbers from.
[profile.release]
lto = "fat"

# The benchmarks measure what ships, so they are built the way a release is: the profile inherits
# it whole, and the only addition is the line tables a profile needs to name functions. Debug
# information is metadata and changes no codegen decision.
[profile.bench]
inherits = "release"
debug = "line-tables-only"

# Tests build without debug information, which cuts the build of a test suite by about 40% against
# full debug information and takes a quarter of its disk. A failing test still names its file and
# line: a panic carries its location without debug information. A backtrace names the functions
# without their lines. `cargo build`, `cargo run` and the benchmarks keep their own profiles.
[profile.test]
debug = false

# One lint table for both crates of the workspace, so the macros crate is held to what the
# runtime crate is held to.
[workspace.lints.rust]
unsafe_code = "forbid"
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"
# Imports: a name is imported once, at the top of the file.
redundant_imports = "warn"
unused_import_braces = "warn"
# Dead and redundant code: casts, lifetimes and macro arms that change nothing.
closure_returning_async_block = "warn"
explicit_outlives_requirements = "warn"
impl_trait_redundant_captures = "warn"
macro_use_extern_crate = "warn"
meta_variable_misuse = "warn"
redundant_lifetimes = "warn"
single_use_lifetimes = "warn"
trivial_casts = "warn"
trivial_numeric_casts = "warn"
unit_bindings = "warn"
unused_extern_crates = "warn"
unused_lifetimes = "warn"
unused_macro_rules = "warn"
# Hidden behaviour: code that reads one way and runs another.
ambiguous_negative_literals = "warn"
deref_into_dyn_supertrait = "warn"
ffi_unwind_calls = "warn"
non_ascii_idents = "warn"
unstable_features = "warn"

[workspace.lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"
cognitive_complexity = "warn"
# Imports: a path is brought into scope with `use`, never spelled out inline.
absolute_paths = "warn"
alloc_instead_of_core = "warn"
unnecessary_self_imports = "warn"
# Panics: library code returns its errors; tests may unwrap.
unwrap_used = "warn"
unwrap_in_result = "warn"
missing_assert_message = "warn"
string_slice = "warn"
# Numbers: big endian, the network order, on the wire.
little_endian_bytes = "warn"
non_zero_suggestions = "warn"
# Idiomatic std: the shortest form that says what the code does.
map_with_unused_argument_over_ranges = "warn"
return_and_then = "warn"
deref_by_slicing = "warn"
if_then_some_else_none = "warn"
iter_over_hash_type = "warn"
create_dir = "warn"
filetype_is_file = "warn"
mutex_atomic = "warn"
mutex_integer = "warn"
needless_raw_strings = "warn"
pathbuf_init_then_push = "warn"
rc_buffer = "warn"
rc_mutex = "warn"
str_to_string = "warn"
string_add = "warn"
string_lit_chars_any = "warn"
verbose_file_reads = "warn"
# Unfinished and debugging code does not ship.
dbg_macro = "warn"
exit = "warn"
todo = "warn"
unimplemented = "warn"
# Numbers and casts say what they mean.
as_pointer_underscore = "warn"
as_underscore = "warn"
decimal_literal_representation = "warn"
float_cmp_const = "warn"
fn_to_numeric_cast_any = "warn"
host_endian_bytes = "warn"
lossy_float_literal = "warn"
modulo_arithmetic = "warn"
precedence_bits = "warn"
suspicious_xor_used_as_pow = "warn"
# Memory and unsafe code, for any that a dependency's macro brings in.
default_union_representation = "warn"
inline_asm_x86_att_syntax = "warn"
mem_forget = "warn"
multiple_unsafe_ops_per_block = "warn"
undocumented_unsafe_blocks = "warn"
unnecessary_safety_comment = "warn"
unnecessary_safety_doc = "warn"
# Errors are kept, not dropped.
pointer_format = "warn"
try_err = "warn"
unused_result_ok = "warn"
# Names and modules.
cfg_not_test = "warn"
disallowed_script_idents = "warn"
error_impl_error = "warn"
partial_pub_fields = "warn"
pub_without_shorthand = "warn"
redundant_test_prefix = "warn"
# Patterns and control flow.
mixed_read_write_in_expression = "warn"
ref_patterns = "warn"
rest_pat_in_fully_bound_structs = "warn"
unnecessary_rest_pattern = "warn"
unneeded_field_pattern = "warn"
# Consistent style.
doc_paragraphs_missing_punctuation = "warn"
empty_drop = "warn"
empty_enum_variants_with_brackets = "warn"
empty_structs_with_brackets = "warn"
large_include_file = "warn"
redundant_type_annotations = "warn"
semicolon_inside_block = "warn"


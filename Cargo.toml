[package]
name = "ruststream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Async messaging framework for Rust: broker-agnostic traits, router, codecs, and a conformance harness for broker authors."
readme = "README.md"
keywords = ["messaging", "async", "broker", "pubsub", "event-driven"]
categories = ["asynchronous", "network-programming"]

# The whole surface is behind additive features, and `default` is `json` alone, so a default build
# on docs.rs publishes a reference with the runtime, codec, AsyncAPI, metrics, testing and
# conformance modules missing - the ones the guides send readers to.
[package.metadata.docs.rs]
all-features = true

# The types from dependencies that the public API is allowed to name, checked by
# `cargo check-external-types` in CI. Every entry here is a version bump of that dependency
# turned into a breaking change for every broker crate downstream, so the list is the record of
# which ones that trade was accepted for. Paths are the internal ones the tool reports (it reads
# rustdoc JSON, not the re-export path), and a new leak is a compile error until it is either
# removed from the surface or argued for and added here.
[package.metadata.cargo_check_external_types]
allowed_external_types = [
    # Re-exported from the crate root so `#[subscriber]` and friends resolve without a second
    # dependency; the macro crate ships in lockstep with an exact pin.
    "ruststream_macros::*",
    # The message contract itself: a payload is whatever serde can carry, and the codecs are
    # generic over it. `serde_core` is where serde 1.0.229 moved the traits.
    "serde::*",
    "serde_core::*",
    # The payload container and the buffer handlers write into.
    "bytes::bytes::Bytes",
    "bytes::bytes_mut::BytesMut",
    # The owned string beside them: a header key and a message name are shared buffers, and the
    # type is in the signature that accepts one. `Str` is an alias, and the tool names the alias
    # where a signature spells it and the underlying type where an impl does, so both paths are
    # the same entry twice.
    "bytes_utils::string::Str",
    "bytes_utils::string::StrInner",
    # A Subscriber is a Stream: that is the core design decision, not an accident.
    "futures_core::stream::Stream",
    # `tokio::spawn` handles surface their join failure through the app lifecycle.
    "tokio::runtime::task::error::JoinError",
    # `MainRuntime` is the app's runtime as a handler reaches it: its `spawn` hands back tokio's
    # join handle, and `as_handle` is the runtime handle itself, the escape hatch for whatever
    # the two methods do not cover.
    "tokio::runtime::task::join::JoinHandle",
    "tokio::runtime::handle::Handle",
    # Optional-feature surfaces: each is the integration point the feature exists for, so the
    # foreign type is the API rather than an implementation detail leaking through it.
    "inventory::Collect",
    "schemars",
    "serde_json::error::Error",
    "serde_json::value::Value",
    "serde_norway::error::Error",
    "prometheus::errors::Error",
    "prometheus::registry::Registry",
    "tracing_subscriber::filter::directive::ParseError",
    "opentelemetry_otlp::exporter::ExporterBuildError",
    "opentelemetry_sdk::error::OTelSdkError",
    "opentelemetry_sdk::metrics::instrument::Instrument",
    "opentelemetry_sdk::metrics::instrument::Stream",
    "opentelemetry_sdk::metrics::meter_provider::SdkMeterProvider",
    "opentelemetry_sdk::trace::provider::SdkTracerProvider",
]

[features]
default = ["json"]
memory = []
conformance = ["testing"]
json = ["dep:serde_json"]
msgpack = ["dep:rmp-serde"]
cbor = ["dep:ciborium"]
macros = ["dep:ruststream-macros"]
asyncapi = ["json", "dep:schemars", "dep:serde_norway"]
metrics = ["dep:prometheus"]
logging = ["dep:tracing-subscriber"]
cli = ["dep:clap", "dep:anyhow"]
poll-diagnostics = ["dep:quanta", "dep:pin-project-lite"]
testing = ["dep:inventory", "tokio/test-util"]
otel = [
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
    "dep:tracing-opentelemetry",
    "dep:tracing-subscriber",
]

[dependencies]
bytes = "1"
# The owned string of the message path: a `Bytes` with the UTF-8 invariant, so a name and a header
# key clone by reference count and can be sliced out of a buffer a broker already holds.
# 0.1.3 is the real floor: `Str::from_static`, which is how a constant key costs nothing, arrived
# there.
bytes-utils = "0.1.3"
futures = "0.3"
# The ring that feeds each dedicated thread of a `threads(n)` subscription: a preallocated SPSC
# ring whose push and pop are a store each. 0.3.5 is the release whose costs were read.
rtrb = "0.4.0"
# 1.0.69 is the real floor: the typed-headers deserializer names `BorrowedStrDeserializer` and
# forwards the 128-bit methods, both of which arrived there.
serde = { version = "1.0.69", features = ["derive"] }
thiserror = "2"

# 1.44 is the real floor: a `threads(n)` thread yields through `task::coop::consume_budget`, which
# landed there.
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# 0.7.10 is the real floor: `TaskTracker`, which the runtime uses to join spawned handlers,
# landed there, so nothing below it ever compiled here.
tokio-util = { version = "0.7.10", features = ["rt"] }
# 0.1.29 is the real floor: it is the first release whose own `tracing-core` bound reaches 0.1.21,
# where `Value` for `Option<T>` landed - the dispatch spans record optional fields.
tracing = "0.1.29"
# The cycle counter the poll-time diagnostics read: `rdtsc` on x86_64 with an invariant TSC, the
# system counter on aarch64, the monotonic clock elsewhere.
quanta = { version = "0.13.0", optional = true }
pin-project-lite = { version = "0.2", optional = true }

# Exact pin: the two crates release in lockstep and the proc-macro surface tracks the library
# release for release (a loose range let a partial `cargo update` pair a new core with an old
# macros crate and fail to compile). Bumped by the same edit as [workspace.package].version.
ruststream-macros = { version = "=0.7.5", path = "crates/ruststream-macros", optional = true }
# 0.3.22 is the real floor, not 0.3: `tracing-opentelemetry` 0.34 requires `^0.3.22`, so the
# `otel` feature never resolved anything lower, and the declared bound claimed years of releases
# that were never built against.
tracing-subscriber = { version = "0.3.22", features = ["env-filter"], optional = true }
serde_json = { version = "1", optional = true }
rmp-serde = { version = "1", optional = true }
# 0.2.1 is the real floor: the crate-root `into_writer`/`from_reader` re-exports the CBOR codec
# calls arrived in that release.
ciborium = { version = "0.2.1", optional = true }
prometheus = { version = "0.14", default-features = false, optional = true }
schemars = { version = "1", optional = true }
serde_norway = { version = "0.9", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
# 1.0.1 is the real floor: `bail!` with a formatted message does not compile against 1.0.0.
anyhow = { version = "1.0.1", optional = true }
# 0.3.5 is the real floor: earlier 0.3 releases lose the broker registrations to a plain GNU ld,
# so the registry comes back empty and the harness reports no transport for a broker that did
# register. Development setups on mold or lld happen to hide it.
inventory = { version = "0.3.5", optional = true }
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"], optional = true }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio"], optional = true }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"], optional = true }
tracing-opentelemetry = { version = "0.34", optional = true }


[workspace]
members = [
    "crates/ruststream-core",
    "crates/ruststream-runtime",
    "crates/ruststream-memory",
    "crates/ruststream-asyncapi",
    "crates/ruststream-observability",
    "crates/ruststream-testing",
    "crates/ruststream-cli",
    "crates/ruststream-conformance",
    "crates/ruststream-macros",
    "crates/ruststream-example-suite",
]
# `templates/` holds cargo-generate scaffolds (rendered by `cargo generate`, not built here): their
# sources carry `{{project-name}}` placeholders that are not valid Rust/TOML until rendered, so they
# must stay out of the workspace. `exclude` alone is not enough: cargo's git-source package
# discovery ignores it and parses every `Cargo.toml` in the repository, which is why the scaffold
# manifests are named `Cargo.toml.liquid` (cargo-generate drops the suffix when it renders them).
exclude = ["templates"]

[workspace.package]
version = "0.7.6"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
homepage = "https://powersemmi.github.io/ruststream/latest/"
authors = ["RustStream contributors"]

[workspace.dependencies]
bytes = "1"
# The owned string of the message path: a `Bytes` with the UTF-8 invariant, so a name and a header
# key clone by reference count and can be sliced out of a buffer a broker already holds.
# 0.1.3 is the real floor: `Str::from_static`, which is how a constant key costs nothing, arrived
# there.
bytes-utils = "0.1.3"
futures = "0.3"
# The ring that feeds each dedicated thread of a `threads(n)` subscription: a preallocated SPSC
# ring whose push and pop are a store each. 0.3.5 is the release whose costs were read.
rtrb = "0.4.0"
# 1.0.69 is the real floor: the typed-headers deserializer names `BorrowedStrDeserializer` and
# forwards the 128-bit methods, both of which arrived there.
serde = { version = "1.0.69", features = ["derive"] }
thiserror = "2"

# 1.44 is the real floor: a `threads(n)` thread yields through `task::coop::consume_budget`, which
# landed there.
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
# 0.7.10 is the real floor: `TaskTracker`, which the runtime uses to join spawned handlers,
# landed there, so nothing below it ever compiled here.
tokio-util = { version = "0.7.10", features = ["rt"] }
# 0.1.29 is the real floor: it is the first release whose own `tracing-core` bound reaches 0.1.21,
# where `Value` for `Option<T>` landed - the dispatch spans record optional fields.
tracing = "0.1.29"
# The cycle counter the poll-time diagnostics read: `rdtsc` on x86_64 with an invariant TSC, the
# system counter on aarch64, the monotonic clock elsewhere.
quanta = "0.13.0"
pin-project-lite = "0.2"

# Exact pin: the two crates release in lockstep and the proc-macro surface tracks the library
# release for release (a loose range let a partial `cargo update` pair a new core with an old
# macros crate and fail to compile). Bumped by the same edit as [workspace.package].version.
ruststream-macros = { version = "=0.7.6", path = "crates/ruststream-macros" }
# The crates the facade re-exports, pinned exactly for the same reason as the macros crate.
ruststream-core = { version = "=0.7.6", path = "crates/ruststream-core" }
ruststream-runtime = { version = "=0.7.6", path = "crates/ruststream-runtime" }
ruststream-memory = { version = "=0.7.6", path = "crates/ruststream-memory" }
ruststream-asyncapi = { version = "=0.7.6", path = "crates/ruststream-asyncapi" }
ruststream-observability = { version = "=0.7.6", path = "crates/ruststream-observability" }
ruststream-testing = { version = "=0.7.6", path = "crates/ruststream-testing" }
ruststream-cli = { version = "=0.7.6", path = "crates/ruststream-cli" }
ruststream-conformance = { version = "=0.7.6", path = "crates/ruststream-conformance" }
# 0.3.22 is the real floor, not 0.3: `tracing-opentelemetry` 0.34 requires `^0.3.22`, so the
# `otel` feature never resolved anything lower, and the declared bound claimed years of releases
# that were never built against.
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
serde_json = "1"
rmp-serde = "1"
# 0.2.1 is the real floor: the crate-root `into_writer`/`from_reader` re-exports the CBOR codec
# calls arrived in that release.
ciborium = "0.2.1"
prometheus = { version = "0.14", default-features = false }
schemars = "1"
serde_norway = "0.9"
clap = { version = "4", features = ["derive"] }
# 1.0.1 is the real floor: `bail!` with a formatted message does not compile against 1.0.0.
anyhow = "1.0.1"
# 0.3.5 is the real floor: earlier 0.3 releases lose the broker registrations to a plain GNU ld,
# so the registry comes back empty and the harness reports no transport for a broker that did
# register. Development setups on mold or lld happen to hide it.
inventory = "0.3.5"
opentelemetry = { version = "0.33", default-features = false, features = ["trace", "metrics"] }
opentelemetry_sdk = { version = "0.33", default-features = false, features = ["trace", "metrics", "rt-tokio"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["grpc-tonic", "trace", "metrics"] }
tracing-opentelemetry = "0.34"


[workspace]
members = ["crates/ruststream-macros"]
# `templates/` holds cargo-generate scaffolds (rendered by `cargo generate`, not built here): their
# sources carry `{{project-name}}` placeholders that are not valid Rust/TOML until rendered, so they
# must stay out of the workspace. `exclude` alone is not enough: cargo's git-source package
# discovery ignores it and parses every `Cargo.toml` in the repository, which is why the scaffold
# manifests are named `Cargo.toml.liquid` (cargo-generate drops the suffix when it renders them).
exclude = ["templates"]

[workspace.package]
version = "0.7.5"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
homepage = "https://powersemmi.github.io/ruststream/latest/"
authors = ["RustStream contributors"]

[[bin]]
name = "ruststream"
path = "src/bin/ruststream/main.rs"
required-features = ["cli"]

[[example]]
name = "macro_app"
required-features = ["macros", "memory"]

[[example]]
name = "otel_propagation"
required-features = ["testing", "macros", "memory", "json", "otel"]
test = true

[[example]]
name = "manual_otel_propagation"
path = "examples/manual/otel_propagation.rs"
required-features = ["testing", "memory", "json", "otel"]
test = true

[[example]]
name = "otel_export"
required-features = ["testing", "macros", "memory", "json", "otel"]
test = true

[[example]]
name = "routed_service"
path = "examples/routed_service/main.rs"
required-features = ["macros", "memory", "json", "metrics", "asyncapi", "logging"]

[[example]]
name = "quickstart"
required-features = ["macros", "memory", "json"]

[[example]]
name = "threads"
required-features = ["testing", "macros", "memory", "json"]
test = true

# No codec feature in the list, and none missing: the message serializes itself, so the whole
# service builds with the codec layer switched off.
[[example]]
name = "protobuf"
required-features = ["testing", "macros", "memory"]
test = true

# The `manual_*` examples are the macro-free counterparts the guides show side by side with the
# macro form. They deliberately do not require the `macros` feature: that is what proves the
# hand-written path stands on its own.
[[example]]
name = "manual_quickstart"
path = "examples/manual/quickstart.rs"
required-features = ["memory", "json"]


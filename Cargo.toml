[workspace]
members = ["crates/ruststream-macros"]
# `templates/` holds cargo-generate scaffolds (rendered by `cargo generate`, not built here): their
# sources carry `{{project-name}}` placeholders that are not valid Rust/TOML until rendered, so they
# must stay out of the workspace.
exclude = ["templates"]

[workspace.package]
version = "0.5.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/powersemmi/ruststream"
authors = ["RustStream contributors"]

[[bin]]
name = "ruststream"
path = "src/bin/ruststream/main.rs"
required-features = ["cli"]

[[example]]
name = "macro_app"
required-features = ["macros", "memory"]

[[example]]
name = "routed_service"
path = "examples/routed_service/main.rs"
required-features = ["macros", "memory", "json", "metrics", "asyncapi", "logging"]

[[example]]
name = "quickstart"
required-features = ["macros", "memory", "json"]

[[example]]
name = "tutorial"
path = "examples/tutorial/main.rs"
required-features = ["macros", "memory", "json"]

[[example]]
name = "subscribers"
required-features = ["macros", "memory", "json"]

[[example]]
name = "publishing"
required-features = ["macros", "memory", "json"]

[[example]]
name = "retry"
required-features = ["macros", "memory", "json"]

[[example]]
name = "failure_policy"

[[example]]
name = "post_settle"
required-features = ["macros", "memory", "json"]

[[example]]
name = "routing"
required-features = ["macros", "memory", "json"]

[[example]]
name = "codecs"
required-features = ["macros", "memory", "json", "cbor"]

[[example]]
name = "middleware"
required-features = ["macros", "memory", "json"]

[[example]]
name = "middleware_app_scope"
required-features = ["macros", "memory", "json"]

[[example]]
name = "middleware_router_scope"
required-features = ["macros", "memory", "json"]

[[example]]
name = "context"
required-features = ["macros", "memory", "json"]

[[example]]
name = "context_field"

[[example]]
name = "from_context"
required-features = ["testing", "macros", "memory", "json"]

[[example]]
name = "lifespan"
required-features = ["macros", "memory", "json"]

[[example]]
name = "asyncapi_http"
required-features = ["macros", "memory", "asyncapi"]

[[example]]
name = "metrics_http"
required-features = ["macros", "memory", "metrics"]

[[example]]
name = "logging"
required-features = ["macros", "memory", "json", "logging"]

[[example]]
name = "logging_middleware"
required-features = ["macros", "memory", "json", "logging"]

[[example]]
name = "testing"
required-features = ["testing", "macros", "memory", "json"]

[[test]]
name = "app_dispatch"
required-features = ["memory", "json"]

[[test]]
name = "asyncapi"
required-features = ["asyncapi", "memory", "macros"]

[[test]]
name = "batch_subscriber"
required-features = ["macros", "memory", "json", "testing"]

[[test]]
name = "codecs"
required-features = ["macros", "memory", "cbor", "msgpack"]

[[test]]
name = "composition_rules"
required-features = ["macros", "memory", "json", "testing"]

[[test]]
name = "conformance_self"
required-features = ["conformance", "memory"]

[[test]]
name = "doc_testing_memory"
required-features = ["memory", "macros", "json", "testing"]

[[test]]
name = "failure_policy"
required-features = ["macros", "memory", "json"]

[[test]]
name = "from_context"
required-features = ["macros", "memory", "json", "testing"]

[[test]]
name = "macro_subscriber"
required-features = ["macros", "memory", "json"]

[[test]]
name = "metrics"
required-features = ["metrics", "memory", "json"]

[[test]]
name = "retry_semantics"
required-features = ["macros", "memory", "json"]

[[test]]
name = "scope_codec"
required-features = ["macros", "memory", "json"]

[[test]]
name = "router_include"
required-features = ["macros", "memory", "json"]

[[test]]
name = "router_publishing"
required-features = ["macros", "memory", "json"]

[[test]]
name = "workers"
required-features = ["macros", "memory", "json"]

[[test]]
name = "testing_harness"
required-features = ["testing", "macros", "memory", "json"]

[[test]]
name = "ui"
required-features = ["macros", "memory", "json"]

[package]
name = "ruststream"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Async messaging framework for Rust: broker-agnostic traits, router, codecs, and a conformance harness for broker authors."
readme = "README.md"
keywords = ["messaging", "async", "broker", "faststream", "nats"]
categories = ["asynchronous", "network-programming"]

[features]
default = ["json"]
memory = []
conformance = ["testing"]
json = ["dep:serde_json"]
msgpack = ["dep:rmp-serde"]
cbor = ["dep:ciborium"]
macros = ["dep:ruststream-macros"]
asyncapi = ["json", "dep:schemars", "dep:serde_norway"]
metrics = ["dep:prometheus"]
logging = ["dep:tracing-subscriber"]
opentelemetry = []
cli = ["dep:clap", "dep:anyhow"]
testing = ["dep:inventory", "tokio/test-util"]

[dependencies]
bytes = "1"
futures = "0.3"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"

ruststream-macros = { version = "0.5", path = "crates/ruststream-macros", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
serde_json = { version = "1", optional = true }
rmp-serde = { version = "1", optional = true }
ciborium = { version = "0.2", optional = true }
prometheus = { version = "0.14", default-features = false, optional = true }
schemars = { version = "1", optional = true }
serde_norway = { version = "0.9", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
anyhow = { version = "1", optional = true }
inventory = { version = "0.3", optional = true }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "test-util"] }
tempfile = "3"
axum = "0.8"
trybuild = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unreachable_pub = "deny"
missing_docs = "deny"
missing_debug_implementations = "warn"
unused_qualifications = "warn"

[lints.clippy]
correctness = { level = "deny", priority = -1 }
suspicious = { level = "deny", priority = -1 }
perf = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_const_for_fn = "allow"
multiple_crate_versions = "allow"
redundant_pub_crate = "allow"

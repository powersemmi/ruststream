# Apple's linker warns when a binary's unwind table passes 16 MB, which the `suite` test binary
# does, and the gates deny warnings (`build.warnings` in the justfile). The warning is only advice
# about exception-handling speed, so on Apple targets the lint that turns linker output into rustc
# warnings is allowed. The compact unwind table stays: without it the macOS unwinder cannot start
# a panic at all, and every panic aborts.
[target.'cfg(target_vendor = "apple")']
rustflags = ["-A", "linker-messages"]

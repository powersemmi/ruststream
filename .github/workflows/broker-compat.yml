name: Broker compatibility

# A release that breaks the broker crates announces itself to nobody: every broker pins the
# previous minor line, so nothing fails anywhere when the tag lands - the breakage only surfaces
# when a broker author starts the adoption by hand. This probe builds each broker against the
# released core the moment the release exists, and reports what broke where the broker's
# maintainer will look for it: an issue in the core repository, where the family files every
# issue, labelled with the broker's name and carrying the compiler's own error text.
#
# The probe is compile-surface only. `--all-targets` compiles the broker's tests and examples
# without running them, which is exactly what a core version bump breaks; behavioral drift is the
# broker CI's job once the adoption lands. Runtime suites would also need each broker's docker
# stand, and shared-runner flakiness would turn a compatibility signal into noise.

on:
  release:
    types: [published]
  # Re-runs: probe an older tag, or probe again after a broker fixed itself without waiting for
  # the next release.
  workflow_dispatch:
    inputs:
      ref:
        description: "Core tag or ref to probe against (defaults to the ref the run started from)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: broker-compat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe:
    name: ${{ matrix.broker }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The verdict is an issue in this repository; only the report step sees the token.
      issues: write
    strategy:
      # Every broker gets its verdict: one broken broker must not hide the other twelve.
      fail-fast: false
      matrix:
        broker:
          - ruststream-nats
          - ruststream-fred
          - ruststream-lapin
          - ruststream-rdkafka
          - ruststream-amqp
          - ruststream-gcp-pubsub
          - ruststream-sqs-sns
          - ruststream-pulsar
          - ruststream-rumqttc
          - ruststream-zeromq
          - ruststream-sea-file
          - ruststream-kinesis
          - ruststream-sqlx
    steps:
      - name: Check out the core at the probed ref
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
          path: core
          persist-credentials: false

      - name: Check out the broker at its default branch
        uses: actions/checkout@v7
        with:
          repository: powersemmi/${{ matrix.broker }}
          path: broker
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      # Some broker clients generate their protocol code at build time (pulsar's build script
      # runs protoc), as the broker's own CI does after installing it.
      - name: Install protoc
        run: sudo apt-get install -y --no-install-recommends protobuf-compiler

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: broker
          key: ${{ matrix.broker }}

      # The same probe a broker author's adoption branch starts from: the version requirement is
      # replaced by a path to the released core, everything else in the manifest stays as the
      # broker declared it. A red check here therefore reproduces exactly what the maintainer
      # will see, not an artifact of the harness.
      - name: Point the broker at the released core
        run: |
          sed -i 's#^ruststream = { version = "[^"]*"#ruststream = { path = "../core"#' broker/Cargo.toml
          grep '^ruststream = ' broker/Cargo.toml

      - name: Build the broker against the core
        id: check
        continue-on-error: true
        working-directory: broker
        run: |
          # Each check keeps its own pipeline, because a brace group feeding `tee` runs in a
          # subshell: a failure recorded inside it never reaches the status this step exits with.
          set -o pipefail
          status=0
          log="$RUNNER_TEMP/check.log"
          : > "$log"
          # The unpublished members (benchmarks, examples) are built with their own features: a
          # benchmark refuses the `testing` feature on purpose, and every-feature builds are a
          # property of the published crates, which is what the broker's own gates check too.
          # A manifest cargo cannot read fails here; its error goes to the log the report quotes.
          echo "\$ cargo metadata --no-deps" >> "$log"
          if ! metadata="$(cargo metadata --no-deps --format-version 1 2>>"$log")"; then
            cat "$log"
            exit 1
          fi
          unpublished="$(jq -r '.packages[] | select(.publish == []) | .name' <<<"$metadata")"
          exclude=""
          for name in $unpublished; do exclude+=" --exclude $name"; done
          echo "\$ cargo check --workspace$exclude --all-targets --all-features" | tee -a "$log"
          cargo check --workspace $exclude --all-targets --all-features 2>&1 | tee -a "$log" \
            || status=1
          for name in $unpublished; do
            echo | tee -a "$log"
            echo "\$ cargo check -p $name --all-targets" | tee -a "$log"
            cargo check -p "$name" --all-targets 2>&1 | tee -a "$log" || status=1
          done
          echo | tee -a "$log"
          echo "\$ cargo check --workspace --no-default-features" | tee -a "$log"
          cargo check --workspace --no-default-features 2>&1 | tee -a "$log" || status=1
          exit "$status"

      - name: Report the verdict in the core repository
        env:
          GH_TOKEN: ${{ github.token }}
          # A classic token of the board's owner with the `project` scope, as the board sync uses.
          BOARD_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
          REPO: ${{ github.repository }}
          BROKER: ${{ matrix.broker }}
          OUTCOME: ${{ steps.check.outcome }}
          CORE_REF: ${{ inputs.ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The broker's label in this repository is its crate name without the family prefix.
          label="${BROKER#ruststream-}"
          version="${CORE_REF#v}"
          marker="against ruststream v$version"
          prefix="core-compat: $BROKER "
          # One open core-compat issue per broker is the whole protocol: filing opens it, the next
          # broken release comments on it, the first green probe closes it.
          existing="$(gh issue list --repo "$REPO" --state open --label "$label" \
            --search 'core-compat in:title' --limit 100 --json number,title \
            | jq -r --arg p "$prefix" 'map(select(.title | startswith($p))) | .[0].number // empty')"

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$existing" ]; then
              gh issue close "$existing" --repo "$REPO" \
                --comment "$BROKER builds $marker (checked by [this probe]($RUN_URL))."
            fi
            exit 0
          fi

          # The error section is what the maintainer needs; everything before the first error is
          # build progress. GitHub caps an issue body at 65536 characters, the cap below leaves
          # room for the prose around the log.
          log="$(sed -n '/^error/,$p' "$RUNNER_TEMP/check.log" | head -c 50000)"
          # A failure with no compiler error line (a network hiccup, a missing tool) still needs
          # a report the maintainer can read.
          [ -n "$log" ] || log="$(tail -c 20000 "$RUNNER_TEMP/check.log")"
          body="$(printf '%s\n' \
            "ruststream v$version was released and \`$BROKER\` does not build against it." \
            "Checked by [this probe]($RUN_URL): the version requirement replaced by a path" \
            "dependency on the released core, then \`cargo check --all-targets\` of the" \
            "published crates with every feature and of the others with their own, and" \
            "\`--no-default-features\`." \
            "" \
            "<details><summary>error log</summary>" \
            "" \
            '```text' \
            "$log" \
            '```' \
            "" \
            "</details>")"

          if [ -n "$existing" ]; then
            # A re-run of the same probe adds nothing; a new version failing on an open issue does.
            if gh issue view "$existing" --repo "$REPO" --json body,comments \
                --jq '.body, .comments[].body' | grep -qF "$marker"; then
              echo "already reported $marker in #$existing"
              exit 0
            fi
            comment="$(printf 'Still broken %s.\n\n%s' "$marker" "$body")"
            gh issue comment "$existing" --repo "$REPO" --body "$comment"
            exit 0
          fi

          url="$(gh issue create --repo "$REPO" --label "$label" \
            --title "${prefix}broken $marker" --body "$body")"
          echo "filed $url"

          # The board sync would pick the issue up within hours; adding it here puts it on the
          # board the moment it exists. A board failure leaves the filed issue standing.
          if [ -z "$BOARD_TOKEN" ]; then
            echo "::warning::PROJECT_BOARD_TOKEN is not set; $url waits for the board sync"
            exit 0
          fi
          export GH_TOKEN="$BOARD_TOKEN"
          board() {
            local item project_id field_id
            item="$(gh project item-add 3 --owner "@me" --url "$url" --format json -q .id)" \
              || return 1
            project_id="$(gh project view 3 --owner "@me" --format json -q .id)" || return 1
            field_id="$(gh project field-list 3 --owner "@me" --format json \
              -q '.fields[] | select(.name == "Opened by") | .id')" || return 1
            # The board sync writes the issue's author into the field, and the issue's author is
            # the Actions bot, so the same value goes in here and the sync leaves it alone.
            gh project item-edit --project-id "$project_id" --id "$item" --field-id "$field_id" \
              --text "github-actions[bot]" > /dev/null
          }
          board || echo "::warning::could not put $url on the board; it waits for the board sync"

      # continue-on-error swallowed the check's status so the report step could run; put it back,
      # so the run page reads as the summary: a red leg is a broken broker.
      - name: Propagate the verdict
        if: steps.check.outcome == 'failure'
        run: exit 1

name: Project board

# The family board collects the open issues and pull requests of every repository linked to it.
# GitHub's own auto-add rule watches one repository per rule, and the free plan allows only a few
# rules, so this job adds whatever the broker repositories opened since its last run. Projects
# have no built-in author field, so the job also fills the "Opened by" text field, and it keeps the
# "Closes" field of every open pull request equal to the issues the pull request closes.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  sync:
    name: Sync the family board
    runs-on: ubuntu-latest
    env:
      # A classic token with the `project` scope; the repositories are public, so reading them
      # needs nothing more. The default GITHUB_TOKEN cannot reach a user-owned project.
      GH_TOKEN: ${{ secrets.PROJECT_BOARD_TOKEN }}
      OWNER: powersemmi
      PROJECT: "3"
      FIELD: Opened by
      CLOSES_FIELD: Closes
    steps:
      - name: Add new items, fill their authors and the issues they close
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::secret PROJECT_BOARD_TOKEN is not set"
            exit 1
          fi

          project_id=$(gh project view "$PROJECT" --owner "$OWNER" --format json -q .id)
          field_id=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json \
            -q ".fields[] | select(.name == \"$FIELD\") | .id")
          repos=$(gh api graphql -F owner="$OWNER" -F number="$PROJECT" -f query='
            query($owner: String!, $number: Int!) {
              user(login: $owner) {
                projectV2(number: $number) {
                  repositories(first: 100) { nodes { nameWithOwner } }
                }
              }
            }' -q '.data.user.projectV2.repositories.nodes[].nameWithOwner')

          on_board=$(gh project item-list "$PROJECT" --owner "$OWNER" --limit 5000 \
            --format json -q '.items[].content.url')
          added=0
          for repo in $repos; do
            urls=$( {
              gh issue list -R "$repo" --state open --limit 500 --json url -q '.[].url'
              gh pr list -R "$repo" --state open --limit 500 --json url -q '.[].url'
            } )
            for url in $urls; do
              if ! grep -qxF "$url" <<< "$on_board"; then
                gh project item-add "$PROJECT" --owner "$OWNER" --url "$url" > /dev/null
                added=$((added + 1))
              fi
            done
          done

          key=$(tr '[:upper:]' '[:lower:]' <<< "$FIELD")
          filled=0
          while read -r item url; do
            [ -n "$item" ] || continue
            repo=$(cut -d/ -f4-5 <<< "$url")
            login=$(gh api "repos/$repo/issues/${url##*/}" -q .user.login)
            gh project item-edit --project-id "$project_id" --id "$item" \
              --field-id "$field_id" --text "$login" > /dev/null
            filled=$((filled + 1))
          done < <(gh project item-list "$PROJECT" --owner "$OWNER" --limit 5000 --format json \
            -q ".items[] | select(.content.url != null and (.[\"$key\"] // \"\") == \"\")
                | \"\(.id) \(.content.url)\"")

          # A description can gain or lose its closing keywords at any time, so the field of every
          # open pull request is compared with its references on each run.
          closes_id=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json \
            -q ".fields[] | select(.name == \"$CLOSES_FIELD\") | .id")
          closes_key=$(tr '[:upper:]' '[:lower:]' <<< "$CLOSES_FIELD")
          pr_items=$(gh project item-list "$PROJECT" --owner "$OWNER" --limit 5000 --format json \
            -q ".items[] | select(.content.type == \"PullRequest\")
                | \"\(.content.url)\t\(.id)\t\(.[\"$closes_key\"] // \"\")\"")
          relinked=0
          for repo in $repos; do
            while IFS=$'\t' read -r url refs; do
              line=$(awk -F'\t' -v u="$url" '$1 == u' <<< "$pr_items")
              [ -n "$line" ] || continue
              item=$(cut -f2 <<< "$line")
              [ "$refs" != "$(cut -f3 <<< "$line")" ] || continue
              if [ -n "$refs" ]; then
                gh project item-edit --project-id "$project_id" --id "$item" \
                  --field-id "$closes_id" --text "$refs" > /dev/null
              else
                gh project item-edit --project-id "$project_id" --id "$item" \
                  --field-id "$closes_id" --clear > /dev/null
              fi
              relinked=$((relinked + 1))
            done < <(gh pr list -R "$repo" --state open --limit 500 \
              --json url,closingIssuesReferences \
              -q '.[] | "\(.url)\t\([.closingIssuesReferences[]
                    | "\(.repository.name)#\(.number)"] | join(", "))"')
          done

          {
            echo "added $added items, filled the author of $filled"
            echo "updated the closed issues of $relinked pull requests"
          } >> "$GITHUB_STEP_SUMMARY"

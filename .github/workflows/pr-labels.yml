name: Pull request labels

# The labels start the automated reviews, so they follow what a pull request changes:
# `enhancement` for code and tests, `documentation` for rustdoc and the docs, `github_actions` for
# workflows. `bug` is a judgement about the shipped library and stays with the author. A release,
# a pull request that changes only the manifests and the lock file and bumps a manifest's own
# version, gets a label named after the version instead, created on first use. The job only adds
# labels, so one set by hand is never taken away. Every repository of the family calls
# this workflow, so the rules live here once.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_call:

permissions:
  # Creating a repository label is an issues permission.
  issues: write
  pull-requests: write

jobs:
  label:
    name: Label by changed files
    # Dependabot labels its own pull requests. A pull request from a fork gets a read-only
    # token, so it is labelled by hand.
    if: >-
      github.event.pull_request.user.login != 'dependabot[bot]'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
    steps:
      # The job reads the changed files through the API and never checks the code out.
      - name: Add the labels the changes call for
        run: |
          set -euo pipefail
          # GitHub omits the patch of a very large file; such a file counts as changed code.
          entries=$(gh api "repos/$REPO/pulls/$PR/files" --paginate \
            -q '.[] | {filename, patch: (.patch // "+<patch omitted>")}')
          files=$(jq -r .filename <<< "$entries")
          patches=$(jq -r .patch <<< "$entries")
          rust_patches=$(jq -r 'select(.filename | endswith(".rs")) | .patch' <<< "$entries")
          existing=$(gh label list -R "$REPO" --limit 500 --json name -q '.[].name')

          # A package's own version is a top-level `version` key; a dependency's sits inside its
          # entry. The root manifest names the version when a workspace bumps several.
          version=""
          if ! grep -qvE '(^|/)Cargo\.(toml|lock)$' <<< "$files"; then
            root=$(jq -r 'select(.filename == "Cargo.toml") | .patch' <<< "$entries")
            members=$(jq -r 'select(.filename | endswith("/Cargo.toml")) | .patch' <<< "$entries")
            bump='^\+version\s*=\s*"\K[^"]+'
            version=$(grep -m1 -oP "$bump" <<< "$root" || grep -m1 -oP "$bump" <<< "$members" \
              || true)
          fi
          if [ -n "$version" ]; then
            label="v$version"
            if ! grep -qxF "$label" <<< "$existing"; then
              gh label create "$label" -R "$REPO" --color 0E8A16 \
                --description "Release $version" > /dev/null
            fi
            gh api "repos/$REPO/issues/$PR/labels" -f "labels[]=$label" > /dev/null
            echo "release: $label" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          wanted=()
          # A Rust file whose changed lines are all comments is a documentation change only.
          rust_code=$(grep -E '^[+-]' <<< "$rust_patches" \
            | grep -vE '^[+-][[:space:]]*(//.*)?$' || true)
          if [ -n "$rust_code" ] || grep -qE '(^|/)Cargo\.toml$' <<< "$files"; then
            wanted+=(enhancement)
          fi
          outside_github=$(grep -vE '^\.github/' <<< "$files" || true)
          if grep -qE '\.md$|^docs/|^website/|llms\.txt$|^context7\.json$|^\.agents/' \
              <<< "$outside_github"; then
            wanted+=(documentation)
          elif grep -qE '^[+-][[:space:]]*//[/!]' <<< "$patches"; then
            wanted+=(documentation)
          fi
          if grep -qE '^\.github/workflows/' <<< "$files"; then
            wanted+=(github_actions)
          fi

          # A label the repository does not define is skipped rather than created.
          args=()
          for label in "${wanted[@]}"; do
            if grep -qxF "$label" <<< "$existing"; then
              args+=(-f "labels[]=$label")
            fi
          done
          if [ ${#args[@]} -gt 0 ]; then
            gh api "repos/$REPO/issues/$PR/labels" "${args[@]}" > /dev/null
          fi
          echo "labels: ${wanted[*]:-none}" >> "$GITHUB_STEP_SUMMARY"

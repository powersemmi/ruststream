name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      dist: ${{ steps.filter.outputs.dist }}
      templates: ${{ steps.filter.outputs.templates }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - 'src/**'
              - 'crates/**'
              - 'tests/**'
              - 'examples/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - 'rust-toolchain.toml'
              - 'rustfmt.toml'
              - 'clippy.toml'
              - '.github/workflows/ci.yml'
            dist:
              - 'src/**'
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.github/workflows/ci.yml'
            templates:
              - 'templates/**'
              - 'src/**'
              - 'Cargo.toml'
              - '.github/workflows/ci.yml'

  rust:
    name: Build and test (${{ matrix.toolchain }})
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor, what users build with, and the early warning. Releases in between add
        # nothing: what fails on a later one fails on the floor too.
        toolchain: [stable, beta, "1.88"]
    # Installing a toolchain does not select it: `rust-toolchain.toml` outranks the rustup
    # default the install action sets. RUSTUP_TOOLCHAIN outranks the file.
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        if: matrix.toolchain == 'stable'
        run: cargo fmt --all -- --check

      - name: cargo clippy
        if: matrix.toolchain == 'stable'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      # Advisory, not a gate: surfaces a lint added by the next clippy release six weeks
      # before it turns the build red.
      - name: cargo clippy (beta, advisory)
        if: matrix.toolchain == 'beta'
        continue-on-error: true
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: cargo check (no default features)
        run: cargo check --locked --workspace --no-default-features

      - name: cargo check (all features)
        run: cargo check --locked --workspace --all-targets --all-features

      # The `DefaultCodec` fallback aliases (cbor, then msgpack) are cfg'd out whenever `json` is
      # on, so neither the all-features build nor the all-features tests ever compile them. Build
      # each single-codec configuration so the alias and its default-codec call sites stay valid.
      - name: cargo check (single-codec default fallbacks)
        if: matrix.toolchain == 'stable'
        run: |
          cargo check --locked --no-default-features --features cbor,memory,macros
          cargo check --locked --no-default-features --features msgpack,memory,macros

      # Stable only: the UI snapshots record rustc's exact wording, and beta renders wording
      # stable has not shipped. Unset elsewhere, the two tests skip themselves.
      - name: cargo test
        env:
          RUN_UI_TESTS: ${{ matrix.toolchain == 'stable' && '1' || '0' }}
          RUN_SCAFFOLD_BUILD: ${{ matrix.toolchain == 'stable' && '1' || '0' }}
        # --no-fail-fast: a failing target must not hide failures in the targets behind it;
        # the log then lists every red test, not just the first binary's.
        run: cargo test --locked --workspace --all-features --no-fail-fast

      # All-features hides a doc example that names a feature-gated item without gating itself.
      # Both ends of the range catch it.
      - name: cargo test --doc (feature edges)
        if: matrix.toolchain == 'stable'
        run: |
          cargo test --locked --workspace --doc
          cargo test --locked --workspace --doc --no-default-features

      # The crate-root missing_docs deny covers item docs; this gate catches what rustc
      # cannot: broken intra-doc links and redundant targets only rustdoc resolves.
      - name: cargo doc
        if: matrix.toolchain == 'stable'
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --workspace --all-features --no-deps

      # trybuild compiles each UI case in a scratch crate under `target/tests`, which is not a
      # cargo profile directory. The cache action walks `target` before it saves, cannot read
      # that tree as one, and reports the miss as a job annotation - a red mark on a green run.
      # The scratch is rebuilt per run anyway, so there is nothing to keep. Runs last and
      # unconditionally: a failing test must not leave the tree behind either.
      - name: Drop the trybuild scratch tree
        if: always()
        run: rm -rf target/tests

  features:
    name: Each feature alone
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-hack
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-hack

      # --no-dev-deps: a dev-dependency in scope masks a missing feature gate in the library.
      # It also rewrites the manifests in place, which is why this is the one job without
      # --locked.
      - name: cargo hack check (each feature)
        run: cargo hack check --workspace --each-feature --no-dev-deps

  minimal-versions:
    name: Minimal versions
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install nightly (resolver only)
        uses: dtolnay/rust-toolchain@nightly

      # The floor, for the build step below. Keep the version in step with
      # `rust-version` in the workspace manifest.
      - name: Install the MSRV toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # The full flag rather than -Z direct-minimal-versions: the narrow one leaves the assembled
      # graph unverified, and that is what a user builds. It costs the pinning list below.
      - name: Resolve minimal versions
        run: cargo +nightly update -Z minimal-versions

      # trybuild 1.0.0 declares `termcolor = "1.0"` but needs `Color: Copy`, added in 1.0.4.
      # A too-loose bound in a third-party manifest; drop this when trybuild's floor moves.
      - name: Pin dependencies whose declared bounds are too loose
        run: cargo update -p termcolor --precise 1.0.4

      # Minimum dependencies on the minimum compiler: the worst case a user can assemble.
      # Resolution above needs nightly, so only this step drops to the floor.
      - name: Build and test against minimal versions
        env:
          RUSTUP_TOOLCHAIN: "1.88"
        run: |
          cargo check --locked --workspace --all-targets --all-features
          cargo test --locked --workspace --all-features --no-fail-fast

  external-types:
    name: Public API surface
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # The tool reads rustdoc JSON, whose format is unstable, so it works only against the
      # nightly it was built for. Move this date and the tool version together.
      - name: Install nightly for rustdoc JSON
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-03-20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-check-external-types
        run: cargo install --locked cargo-check-external-types@0.5.0

      # Allow-list in Cargo.toml. Every entry makes a version bump of that dependency breaking
      # for every broker crate downstream, so a new leak is added deliberately or not at all.
      - name: cargo check-external-types
        run: cargo +nightly-2026-03-20 check-external-types --all-features

  coverage:
    name: Coverage
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-llvm-cov

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Stale instrumented artifacts from the cache double-count files and crater the total.
      - name: Clean stale coverage artifacts
        run: cargo llvm-cov clean --workspace

      # Run the suite under instrumentation once, then format the collected data twice:
      # a human-readable table into the run's job summary, and an lcov file as a downloadable
      # artifact. `report` reuses the profile from `--no-report`, so neither re-runs the tests.
      - name: Run tests under coverage
        run: cargo llvm-cov --locked --no-report --workspace --all-features --no-fail-fast

      # Line-coverage gate, sitting at the 95% DoD target. Raise it here and in the justfile
      # together if coverage climbs further. The summary is written before the gate's exit code
      # propagates, so it shows up even on a failure.
      - name: Coverage summary and gate
        run: |
          set +e
          cargo llvm-cov report --summary-only --fail-under-lines 95 | tee coverage.txt
          rc=${PIPESTATUS[0]}
          {
            echo '## Coverage'
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: Export lcov report
        if: always()
        run: cargo llvm-cov report --lcov --output-path lcov.info

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info

      # Uploaded even when the gate fails, so the badge shows reality. Advisory: a Coveralls
      # outage must not fail the pipeline.
      - name: Upload to Coveralls
        if: always()
        uses: coverallsapp/github-action@v2
        with:
          file: lcov.info
          format: lcov
          fail-on-error: false

  package:
    name: Package (publish dry-run)
    needs: changes
    if: ${{ needs.changes.outputs.dist == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # Both packages in one invocation: packaging strips the path from the lockstep
      # `ruststream-macros` dependency, and between a version bump and the release that version
      # is not on crates.io yet, so packaging ruststream alone cannot resolve it.
      # CARGO_HTTP_MULTIPLEXING=false works around HTTP2 framing failures on the runners.
      - name: cargo publish dry-run (no upload)
        env:
          CARGO_HTTP_MULTIPLEXING: "false"
        run: cargo publish --locked --dry-run -p ruststream-macros -p ruststream --all-features

      # The dry-run verifies each package by building it under `target/package/<crate>`, whose
      # inner trees the cache action cannot read as cargo profiles either (same annotation as
      # the trybuild scratch above). Verification output is per-run; nothing here is reusable.
      - name: Drop the packaging scratch tree
        if: always()
        run: rm -rf target/package

  security:
    name: Security scans
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Dependency-graph gate: RustSec advisories, license allow-list, duplicate
      # versions, and registry sources, per the checked-in deny.toml. Not path-
      # gated: advisories arrive over time, not only with manifest changes.
      - name: cargo deny
        uses: EmbarkStudios/cargo-deny-action@v2

  templates:
    name: Templates (render + compile)
    needs: changes
    if: ${{ needs.changes.outputs.templates == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install cargo-generate
        uses: taiki-e/install-action@v2.86.5
        with:
          tool: cargo-generate

      # Renders the scaffold and compiles it, so template drift fails here and not on a user's
      # first build. The rendered project is patched to this checkout. No --locked: a fresh
      # scaffold has no lock file, which is the situation a user starts from.
      - name: Render and check templates/memory
        run: |
          cargo generate --path templates/memory --name smoke --destination "$RUNNER_TEMP" --vcs none
          {
            echo ""
            echo "[patch.crates-io]"
            echo "ruststream = { path = \"$GITHUB_WORKSPACE\" }"
          } >> "$RUNNER_TEMP/smoke/Cargo.toml"
          cargo check --manifest-path "$RUNNER_TEMP/smoke/Cargo.toml"

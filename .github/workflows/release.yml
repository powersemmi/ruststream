name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  crates-io:
    name: Publish ruststream to crates.io
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          CARGO_VERSION=$(cargo metadata --format-version 1 --no-deps | jq -r '.packages[0].version')
          if [ "${TAG#v}" != "$CARGO_VERSION" ]; then
            echo "Tag '${TAG}' does not match Cargo.toml version '$CARGO_VERSION'"
            exit 1
          fi
          echo "Version $CARGO_VERSION verified"

      - name: Exchange OIDC token for crates.io token
        run: |
          RESPONSE=$(curl -s -X POST \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=crates-io")
          TOKEN=$(echo "$RESPONSE" | jq -r '.token')
          echo "CARGO_REGISTRY_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: cargo publish
        run: cargo publish --all-features

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -q .body)
          gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"

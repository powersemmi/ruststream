name: Release

on:
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

jobs:
  crates-io:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates.io
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Verify ruststream version matches tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          TAG_VERSION="${TAG#v}"
          META=$(cargo metadata --format-version 1 --no-deps)
          # Only the facade must match the tag. The crates behind it share the workspace version,
          # and the publish step skips any version already on crates.io.
          VERSION=$(echo "$META" | jq -r '.packages[] | select(.name == "ruststream") | .version')
          if [ "$TAG_VERSION" != "$VERSION" ]; then
            echo "Tag '${TAG}' does not match ruststream version '$VERSION'"
            exit 1
          fi
          echo "ruststream $VERSION verified against tag ${TAG}"
          echo "$META" | jq -r '.packages[] | select(.name | startswith("ruststream-")) | select(.publish != []) | "\(.name) at \(.version) (published only if not already on crates.io)"'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Authenticate to crates.io via trusted publishing
        uses: rust-lang/crates-io-auth-action@v1
        id: auth

      - name: cargo publish (dependency order)
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          # Publish a crate only if its current version is not already on crates.io,
          # so re-running a release after a partial failure is safe. Each crate goes up after
          # every crate it depends on: the macros and the contract first, the facade last.
          publish() {
            name="$1"; shift
            version=$(cargo metadata --format-version 1 --no-deps \
              | jq -r --arg n "$name" '.packages[] | select(.name == $n) | .version')
            index="https://index.crates.io/${name:0:2}/${name:2:2}/${name}"
            if curl -fsSL "$index" 2>/dev/null | grep -qF "\"vers\":\"${version}\""; then
              echo "$name $version already on crates.io, skipping"
            else
              cargo publish -p "$name" "$@"
            fi
          }
          publish ruststream-macros
          publish ruststream-core --all-features
          publish ruststream-runtime --all-features
          publish ruststream-runtime-tokio --all-features
          publish ruststream-memory --all-features
          publish ruststream-asyncapi --all-features
          publish ruststream-observability --all-features
          publish ruststream-testing --all-features
          publish ruststream-conformance --all-features
          publish ruststream-cli --all-features
          publish ruststream --all-features

      - name: Generate release notes
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          NOTES=$(gh api "repos/$GITHUB_REPOSITORY/releases/generate-notes" \
            -f tag_name="$TAG" -q .body)
          gh release edit "$TAG" --notes "$NOTES" --repo "$GITHUB_REPOSITORY"

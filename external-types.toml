# The types from dependencies that the public API of every published crate is allowed to name,
# checked by `cargo check-external-types --config external-types.toml` on each crate in CI. Every
# entry here is a version bump of that dependency turned into a breaking change for every broker
# crate downstream, so the list is the record of which ones that trade was accepted for. Paths are the internal ones the tool reports (it reads
# rustdoc JSON, not the re-export path), and a new leak is a compile error until it is either
# removed from the surface or argued for and added here.
allowed_external_types = [
    # Re-exported from the crate root so `#[subscriber]` and friends resolve without a second
    # dependency; the macro crate ships in lockstep with an exact pin.
    "ruststream_macros::*",
    # The crates the facade is made of: they ship in lockstep with it, pinned exactly, and every
    # item they hold is re-exported here under its documented path.
    "ruststream_core",
    "ruststream_core::*",
    "ruststream_runtime",
    "ruststream_runtime::*",
    "ruststream_runtime_tokio",
    "ruststream_runtime_tokio::*",
    "ruststream_memory",
    "ruststream_memory::*",
    "ruststream_asyncapi",
    "ruststream_asyncapi::*",
    "ruststream_observability",
    "ruststream_observability::*",
    "ruststream_testing",
    "ruststream_testing::*",
    "ruststream_cli",
    "ruststream_cli::*",
    "ruststream_conformance",
    "ruststream_conformance::*",
    # The message contract itself: a payload is whatever serde can carry, and the codecs are
    # generic over it. `serde_core` is where serde 1.0.229 moved the traits.
    "serde::*",
    "serde_core::*",
    # The payload container and the buffer handlers write into.
    "bytes::bytes::Bytes",
    "bytes::bytes_mut::BytesMut",
    # The owned string beside them: a header key and a message name are shared buffers, and the
    # type is in the signature that accepts one. `Str` is an alias, and the tool names the alias
    # where a signature spells it and the underlying type where an impl does, so both paths are
    # the same entry twice.
    "bytes_utils::string::Str",
    "bytes_utils::string::StrInner",
    # A Subscriber is a Stream: that is the core design decision, not an accident.
    "futures_core::stream::Stream",
    # `tokio::spawn` handles surface their join failure through the app lifecycle.
    "tokio::runtime::task::error::JoinError",
    # `MainRuntime` is the app's runtime as a handler reaches it: its `spawn` hands back tokio's
    # join handle, and `as_handle` is the runtime handle itself, the escape hatch for whatever
    # the two methods do not cover.
    "tokio::runtime::task::join::JoinHandle",
    "tokio::runtime::handle::Handle",
    # The tokio runner's clock is tokio's timer wheel: its `Clock` impl names tokio's instant and
    # timer future, so a sleep is tokio's own future with nothing boxed around it.
    "tokio::time::instant::Instant",
    "tokio::time::sleep::Sleep",
    # Optional-feature surfaces: each is the integration point the feature exists for, so the
    # foreign type is the API rather than an implementation detail leaking through it.
    "inventory::Collect",
    "schemars",
    "serde_json::error::Error",
    "serde_json::value::Value",
    "serde_norway::error::Error",
    "prometheus::errors::Error",
    "prometheus::registry::Registry",
    "tracing_subscriber::filter::directive::ParseError",
    "opentelemetry_otlp::exporter::ExporterBuildError",
    "opentelemetry_sdk::error::OTelSdkError",
    "opentelemetry_sdk::metrics::instrument::Instrument",
    "opentelemetry_sdk::metrics::instrument::Stream",
    "opentelemetry_sdk::metrics::meter_provider::SdkMeterProvider",
    "opentelemetry_sdk::trace::provider::SdkTracerProvider",
]
